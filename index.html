<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1,minimum-scale=1">
<meta name="theme-color" content="#ffb6d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🌸 Vân Khánh Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1428;--ink2:#3a2a4a;--mu:#8a7a9a;
  --shadow:3px 3px 0 var(--ink);--radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:600 13.5px/1.35 "Quicksand",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:#fff5f9;
  padding:0;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,200,220,.5) 0 6px,transparent 7px),
    radial-gradient(circle at 88% 22%,rgba(255,220,240,.45) 0 5px,transparent 6px),
    radial-gradient(circle at 22% 78%,rgba(220,190,240,.4) 0 5px,transparent 6px),
    radial-gradient(circle at 78% 88%,rgba(255,200,220,.4) 0 6px,transparent 7px),
    linear-gradient(160deg,#fff5f9 0%,#fdeef8 25%,#f5ecff 55%,#e8f4ff 85%,#e0f0ff 100%);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:6px;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  position:relative;
}

/* ===== HEADER ===== */
#hd{
  position:relative;border-radius:var(--radius);
  border:2px solid var(--ink);box-shadow:var(--shadow);overflow:hidden;
  background:linear-gradient(155deg,#ffb3d1 0%,#ff8fb8 40%,#c9b6f0 100%);
}
#hd .top{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1.5px solid rgba(26,20,40,.35);
}
#logo{
  flex:none;width:28px;height:28px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);background:#ffc6dd;
}
.logo-wrap{flex:1;min-width:0}
.logo-wrap .t{
  font-family:"Comfortaa","Quicksand",sans-serif;
  font-weight:700;font-size:13px;color:#fff;
  text-shadow:1px 1px 0 rgba(26,20,40,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logo-wrap .t small{
  display:block;font-size:8px;opacity:.9;letter-spacing:1.5px;
  font-weight:700;margin-top:1px;color:#fff;
  text-shadow:1px 1px 0 rgba(26,20,40,.5);
}

/* ===== STATS ===== */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;padding:5px 8px 6px;
  align-items:stretch;
}
.stat-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.95);
  border:2px solid var(--ink);border-radius:8px;
  padding:4px 3px 3px;
  box-shadow:1.5px 1.5px 0 var(--ink);
  height:48px;
  overflow:hidden;
  min-width:0;
  position:relative;
}
.stat-cell .ico{
  position:absolute;top:2px;left:4px;
  font-size:10px;line-height:1;
}
.stat-cell .val{
  font-family:"Comfortaa",sans-serif;
  font-size:14px;font-weight:800;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;width:100%;
  text-align:center;
  margin-top:8px;
  flex:1;
  display:flex;align-items:center;justify-content:center;
}
.stat-cell .bar-mini{
  width:100%;height:4px;border-radius:2px;
  background:rgba(26,20,40,.12);
  border:1px solid var(--ink);
  overflow:hidden;position:relative;
}
.stat-cell .bar-mini i{
  display:block;height:100%;width:100%;
  transform-origin:left center;
  transform:scaleX(0);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.stat-cell.hp .bar-mini i{background:linear-gradient(90deg,#ffb3c1,#ff6b9d)}
.stat-cell.sp .bar-mini i{background:linear-gradient(90deg,#ffe4a8,#ffb84d)}
.stat-cell.lu .bar-mini i{background:linear-gradient(90deg,#c9b6f0,#a890e0)}
.stat-cell.money .sub{
  font-size:8.5px;font-weight:700;color:var(--mu);
  line-height:1;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.stat-cell.warn .bar-mini i{animation:warnBlink 1s ease-in-out infinite}
@keyframes warnBlink{50%{opacity:.4}}

/* ===== BADGE OFFER ===== */
#offerBadge{
  display:none;
  padding:8px 12px;
  background:linear-gradient(180deg,#fff3c9,#ffe0a0);
  border:2px solid var(--ink);
  border-radius:10px;
  box-shadow:2px 2px 0 var(--ink);
  align-items:center;gap:8px;
  font-size:12px;font-weight:800;
  cursor:pointer;
  animation:badgeSlideIn .3s ease-out, badgePulse 2s ease-in-out infinite 1s;
}
#offerBadge.on{display:flex}
#offerBadge b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#offerBadge .x{
  font-size:10.5px;padding:3px 8px;
  border:1.5px solid var(--ink);border-radius:6px;
  background:#fff;color:var(--ink);
}
@keyframes badgeSlideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes badgePulse{
  0%,100%{box-shadow:2px 2px 0 var(--ink)}
  50%{box-shadow:2px 2px 0 var(--ink),0 0 0 4px rgba(255,184,77,.3)}
}

/* ===== SCENE ===== */
#scene{
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  border:2px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);min-height:0;background:#fff;
}
.ch1 #scene{background:linear-gradient(180deg,#ffe9c9 0 40px,#fff8ee 40px)}
.ch2 #scene{background:linear-gradient(180deg,#a8c8e8 0 40px,#f0f8ff 40px)}

#top-info{
  text-align:center;padding:5px 10px 4px;
  font-size:11.5px;font-weight:800;
  border-bottom:1px dashed rgba(26,20,40,.15);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#top-info .period{
  display:inline-block;margin-left:6px;padding:1px 8px;
  border:1.5px solid var(--ink);border-radius:10px;
  background:rgba(255,255,255,.85);font-size:10.5px;
}

#avatar-row{
  display:flex;align-items:center;gap:10px;
  padding:6px 12px 4px;
}
#avatar{
  flex:none;
  width:46px;height:46px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  background:#ffc6dd;
}
#mood{
  flex:1;min-width:0;
  font-size:11px;font-weight:700;line-height:1.35;
  color:var(--ink2);
  padding:5px 10px;
  background:rgba(255,255,255,.85);
  border:1.5px solid var(--ink);border-radius:12px;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#quote{
  font-size:9.5px;font-style:italic;color:var(--mu);
  text-align:center;padding:2px 12px 0;
}

#log-wrap{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:4px 10px 8px;
}
#log-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:3px;
  font-size:10.5px;font-weight:800;
  color:var(--ink2);
  letter-spacing:.3px;
}
#log-header button{
  font-size:9.5px;font-weight:800;
  padding:2px 8px;
  border:1.5px solid var(--ink);border-radius:8px;
  background:linear-gradient(180deg,#fff,#f5f0ff);
  box-shadow:1px 1px 0 var(--ink);
}
#log{
  flex:1;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 10px;
  background:rgba(255,255,255,.92);
  border:1.5px solid var(--ink);border-radius:10px;
  box-shadow:1.5px 1.5px 0 var(--ink);
  font-size:11px;line-height:1.5;
  scrollbar-width:thin;
}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:rgba(26,20,40,.2);border-radius:2px}
#log .ln{display:block;padding:1px 0}
#log .ln::before{content:"· ";opacity:.5;font-weight:800}

/* ===== ACTIONS ===== */
#acts-wrap{
  border:2px solid var(--ink);border-radius:var(--radius);
  background:#fff;box-shadow:var(--shadow);padding:8px;
}
#period-lbl{
  text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.4px;
  margin-bottom:6px;padding-bottom:5px;
  border-bottom:1.5px dashed rgba(26,20,40,.3);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.act{
  position:relative;
  border:2px solid var(--ink);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:11.5px;line-height:1.15;
  height:clamp(52px,6.8vh,64px);
  background:linear-gradient(180deg,#fff,#f5f0ff);
  color:var(--ink);padding:2px;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform .08s ease-out;
  will-change:transform;
  transform:translateZ(0);
}
.act b{font-size:22px;line-height:1.1;margin-bottom:2px;font-weight:400}
.act span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}
.act.dis{opacity:.42;filter:grayscale(.7)}
.act.hoc{background:linear-gradient(180deg,#c9f2df,#a8e6d0)}
.act.lam{background:linear-gradient(180deg,#ffeec4,#ffe4a8)}
.act.viet{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.act.choi{background:linear-gradient(180deg,#ffc6dd,#ff9bbf);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.act.ngu{background:linear-gradient(180deg,#c9b6f0,#a890e0);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.act.an{background:linear-gradient(180deg,#ffd1dc,#ffb3c6)}

#nextBtn{
  width:100%;margin-top:7px;padding:10px;
  border:2px solid var(--ink);border-radius:9px;
  font-family:"Comfortaa",sans-serif;
  font-size:12.5px;font-weight:800;
  background:linear-gradient(180deg,#a8e6d0,#7ecbaf);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.4);
  box-shadow:2px 2px 0 var(--ink);letter-spacing:.4px;
  will-change:transform;
  transform:translateZ(0);
}
#nextBtn:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}

/* ===== NAV ===== */
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
#nav button{
  border:2px solid var(--ink);border-radius:9px;
  font-size:9.5px;font-weight:800;padding:6px 1px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:linear-gradient(180deg,#fff,#f5eeff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
  font-family:"Comfortaa","Quicksand",sans-serif;
  will-change:transform;
  transform:translateZ(0);
}
#nav button b{font-size:15px;line-height:1;font-weight:400}
#nav button:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}

/* ===== FAB ===== */
.fab{
  position:fixed;width:52px;height:52px;
  border-radius:50%;border:2px solid var(--ink);
  color:#fff;font-size:22px;
  display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink);
  z-index:20;
  transition:transform .12s ease-out;
  will-change:transform;
  transform:translateZ(0);
}
.fab:active{transform:translate3d(2px,2px,0);box-shadow:1px 1px 0 var(--ink)}
.fab::after{
  content:attr(data-label);
  position:absolute;bottom:-15px;
  font-size:8.5px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.92);padding:1px 5px;
  border-radius:6px;border:1.5px solid var(--ink);white-space:nowrap;
}
#sleepFab{
  right:14px;bottom:calc(env(safe-area-inset-bottom) + 130px);
  background:linear-gradient(180deg,#c9b6f0,#a890e0);
}
#lotteryFab{
  right:14px;bottom:calc(env(safe-area-inset-bottom) + 194px);
  background:linear-gradient(180deg,#ffe4a8,#ffd070);
  color:#8a5a00;
  display:none;
}
#lotteryFab.on{display:grid}
#writeFab{
  right:14px;bottom:calc(env(safe-area-inset-bottom) + 258px);
  background:linear-gradient(180deg,#ff9bbf,#ff6b9d);
  display:none;
}
#writeFab.on{display:grid}
@media (min-width:520px){
  #sleepFab,#lotteryFab,#writeFab{right:calc(50% - 240px + 14px)}
}

/* ===== SHEET ===== */
#sheet{
  position:fixed;inset:0;z-index:50;
  background:rgba(26,20,40,.78);
  display:flex;align-items:flex-end;justify-content:center;
}
.shx{
  width:100%;max-width:480px;max-height:82vh;overflow:auto;
  border:2px solid var(--ink);border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:#fff;box-shadow:0 -6px 0 var(--ink);
  animation:sup .25s ease-out;
  will-change:transform;
}
@keyframes sup{from{transform:translate3d(0,100%,0)}}
.shh{
  display:flex;align-items:center;font-size:15px;font-weight:800;
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.shh b{flex:1}
h3{
  margin:12px 0 5px;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;gap:5px;
  font-family:"Comfortaa",sans-serif;
}
h3::before{content:"✿";color:#ff6b9d;font-size:15px}
.it{
  display:flex;align-items:center;gap:8px;padding:7px 9px;
  border:1.5px solid var(--ink);border-radius:9px;
  background:#fff;box-shadow:1.5px 1.5px 0 var(--ink);
  margin-bottom:5px;
  contain:layout paint;
}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:12px}
.it small{display:block;color:var(--ink2);font-weight:600;margin-top:1px;font-size:10.5px}
.bs{display:flex;gap:5px;flex-wrap:wrap}
.b2{
  border:2px solid var(--ink);border-radius:9px;
  padding:6px 10px;font-weight:800;font-size:11.5px;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f0eaff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
  will-change:transform;transform:translateZ(0);
}
.b2.p{background:linear-gradient(180deg,#ffb3d1,#ff8fb8);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2.g{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}
.b2:disabled{opacity:.45;filter:grayscale(.5)}

/* ===== MODAL ===== */
#modal{
  position:fixed;inset:0;z-index:60;
  background:rgba(26,20,40,.82);
  display:grid;place-items:center;padding:16px;
}
.bx{
  width:100%;max-width:420px;max-height:88vh;overflow:auto;
  border:2px solid var(--ink);border-radius:18px;
  padding:18px;background:#fff;
  box-shadow:6px 6px 0 var(--ink);
  animation:pp .22s ease-out;
  will-change:transform,opacity;
}
@keyframes pp{from{transform:scale(.92);opacity:0}}
.bx h2{
  margin:0 0 10px;text-align:center;font-size:17px;
  padding-bottom:7px;border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.bx .body{font-size:12.5px;line-height:1.55}
.bx .body b{color:#ff6b9d}
.ev{
  background:linear-gradient(180deg,#fff8e0,#ffeec0);
  border:2px solid var(--ink);border-radius:10px;
  padding:9px 11px;margin:7px 0;
  box-shadow:2px 2px 0 var(--ink);
}
.g2{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12px}
.mb{display:grid;gap:9px;margin-top:12px}
.mb2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.sp{display:flex;justify-content:center;margin:6px 0 5px}
.sp img{
  width:70px;height:70px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  background:#ffc6dd;
}
.btn{
  width:100%;padding:11px;
  border:2px solid var(--ink);border-radius:10px;
  font-family:"Comfortaa",sans-serif;
  font-size:12.5px;font-weight:800;
  background:linear-gradient(180deg,#fff,#f0eaff);
  color:var(--ink);
  box-shadow:2px 2px 0 var(--ink);
  will-change:transform;transform:translateZ(0);
}
.btn.p{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3);
}
.btn.g{
  background:linear-gradient(180deg,#a8e6d0,#7ecbaf);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3);
}
.btn:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}

/* Choice button cho Event 2 lựa chọn */
.choice{
  width:100%;padding:11px 13px;text-align:left;
  border:2px solid var(--ink);border-radius:10px;
  background:linear-gradient(180deg,#fff,#f5f0ff);
  color:var(--ink);
  box-shadow:2px 2px 0 var(--ink);
  font-size:12.5px;font-weight:700;line-height:1.4;
  margin-bottom:7px;
  will-change:transform;transform:translateZ(0);
  white-space:normal;
}
.choice.primary{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3);
}
.choice:active{transform:translate3d(2px,2px,0);box-shadow:0 0 0 var(--ink)}
.choice .sub{
  display:block;font-size:10.5px;opacity:.85;font-weight:600;
  margin-top:2px;font-style:italic;
}

/* ===== TOAST ===== */
#toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);
  z-index:70;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none;
}
#toast div{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;border:2px solid var(--ink);border-radius:12px;
  padding:8px 14px;text-align:center;font-weight:800;font-size:12px;
  box-shadow:3px 3px 0 var(--ink);
  text-shadow:1px 1px 0 rgba(26,20,40,.3);
  animation:toastIn .2s ease-out,toastOut .2s ease-in 1.8s forwards;
}
#toast div.ach{
  background:linear-gradient(180deg,#ffe4a8,#ffb850);
  color:#5a3000;
  text-shadow:none;
  animation:achIn .4s cubic-bezier(.34,1.56,.64,1),toastOut .2s ease-in 2.8s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,-8px,0)}}
@keyframes toastOut{to{opacity:0;transform:translate3d(0,-8px,0)}}
@keyframes achIn{
  from{transform:scale(.5) rotate(-10deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

/* ===== NOTE ===== */
#noteBox{
  width:100%;min-height:80px;
  border:2px solid var(--ink);border-radius:10px;
  padding:8px 10px;
  font:600 12px/1.5 "Quicksand",sans-serif;
  color:var(--ink);background:#fff;
  box-shadow:inset 1.5px 1.5px 0 rgba(26,20,40,.1);
  resize:vertical;
  -webkit-user-select:text;user-select:text;
}
#noteBox:focus{outline:none;border-color:#ff6b9d;box-shadow:0 0 0 3px rgba(255,107,157,.15)}
.noteIt{
  border:1.5px solid var(--ink);border-radius:9px;
  background:linear-gradient(180deg,#fffdf5,#fff8e0);
  box-shadow:1.5px 1.5px 0 var(--ink);
  padding:7px 9px;margin-bottom:5px;
  contain:layout paint;
}
.noteIt .hd{
  display:flex;justify-content:space-between;align-items:center;

/* ====== AUDIO ====== */
let AC=null;
function beep(f=600,d=.1){
  if(!S.snd) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.04,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);
    o.start(t);o.stop(t+d);
    o.onended=()=>{o.disconnect();g.disconnect()};
  }catch(e){}
}

/* ====== RANDOM EVENTS ====== */
function maybeRandomEvent(){
  if(S.rolledToday) return null;
  if(Math.random()>RANDOM_EVENT_CHANCE) return null;
  S.rolledToday=true;
  const isGood=Math.random()<GOOD_EVENT_RATE;
  const pool=isGood?GOOD_EVENTS:BAD_EVENTS;
  return pool[Math.floor(Math.random()*pool.length)];
}

function applyEvent(ev,choiceIdx){
  const choice=ev.choices[choiceIdx];
  const r=choice.result||{};

  if(r.hp) S.hp=cl(S.hp+r.hp,0,100);
  if(r.sp) S.sp=cl(S.sp+r.sp,0,100);
  if(r.money) S.money+=r.money;
  if(r.lu) S.lu=cl(S.lu+r.lu,0,100);
  if(r.skipActions){
    S.periodActionsLeft=Math.max(0,S.periodActionsLeft-r.skipActions);
    S.dayActionsLeft=Math.max(0,S.dayActionsLeft-r.skipActions);
  }

  // Flags
  if(choice.flag){
    S.flags=S.flags||{};
    S.flags[choice.flag]=true;
  }

  // Seen
  if(!S.seenEvents) S.seenEvents={};
  const key=(ev.id||'x')+'_'+(choiceIdx);
  S.seenEvents[key]=1;

  addLog(`${ev.e} ${ev.title}: ${choice.text}`);

  // HP/SP critical warnings
  if(S.hp<20 && S.hp>0) toast('⚠️ HP thấp! Cần nghỉ ngơi.');
  if(S.sp<20 && S.sp>0) toast('⚠️ SP thấp! Tinh thần yếu.');
  if(S.hp<=0) S.hp=30;
}

function showChoiceEvent(ev,callback){
  const html=`
    <h2>${ev.e} ${ev.title}</h2>
    <div class="body" style="text-align:center;margin-bottom:12px;font-style:italic">${ev.desc}</div>
    ${ev.choices.map((c,i)=>`
      <button class="choice ${i===0?'primary':''}" data-a="pickChoice" data-idx="${i}">
        ${c.text}
        ${c.sub?`<span class="sub">${c.sub}</span>`:''}
      </button>
    `).join('')}
  `;
  modal(html);
  window.__currentChoiceEvent=ev;
  window.__choiceCallback=callback||null;
}

function pickChoice(idx){
  const ev=window.__currentChoiceEvent;
  if(!ev) return;
  const choice=ev.choices[idx];

  // Special quit early
  if(choice.special==='quit'){
    mclose();
    window.__currentChoiceEvent=null;
    setTimeout(()=>finishHome(),150);
    return;
  }

  applyEvent(ev,idx);

  mclose();
  window.__currentChoiceEvent=null;
  if(window.__choiceCallback){
    const cb=window.__choiceCallback;
    window.__choiceCallback=null;
    setTimeout(cb,200);
  } else {
    saveNow();drawAll();
  }
}

/* ====== DO ACTION ====== */
function doAct(k){
  if(T.modal) return;
  if(S.periodActionsLeft<=0) return toast('Hết action buổi này');
  const a=ACTS.find(x=>x.k==k);
  if(!a) return;
  if(a.m<0 && S.money<-a.m) return toast('Không đủ tiền');
  if(a.k=='c_wr' && S.lu>=100) return;

  const eff=lowEff();

  // Trừ cost & action
  if(a.hp) S.hp=cl(S.hp+Math.round(a.hp*eff),0,100);
  if(a.sp) S.sp=cl(S.sp+Math.round(a.sp*eff),0,100);
  if(a.m) S.money+=a.m;

  S.periodActionsLeft--;
  S.dayActionsLeft--;
  beep(a.grp=='viet'?880:a.grp=='choi'?660:520,.08);

  // ====== MINIGAME cho Viết luận ======
  if(a.k==='c_wr'){
    const baseReward=WRITE_RATE[S.ch]*eff;
    saveNow();drawAll();
    setTimeout(()=>startWritingMinigame(baseReward),100);
    return;
  }

  // Các action còn lại — cộng luận thẳng
  if(a.lu){
    let rate=0;
    if(a.lu==='write') rate=WRITE_RATE[S.ch];
    else if(a.lu==='fix') rate=FIX_RATE[S.ch];
    else if(a.lu==='meet') rate=MEET_RATE[S.ch];
    else if(a.lu==='lib') rate=LIB_RATE[S.ch];
    const g=Math.round(rate*eff*10)/10;
    S.lu=cl(S.lu+g,0,100);
    addLog(`${a.e} ${a.n}: +${g}% luận văn`);
  } else if(a.grp=='lam'){
    addLog(`${a.e} ${a.n}: +${a.m} tệ`);
  } else {
    addLog(`${a.e} ${a.n}`);
  }

  // Kiểm tra HP thấp → nghỉ ốm
  if(S.hp<20 && S.hp>0){
    saveNow();drawAll();
    setTimeout(()=>{
      modal(`<h2>🤒 Vân Khánh ốm</h2>
      <div class="body">HP xuống dưới 20. Cô phải nghỉ ngơi một ngày.</div>
      <div class="mb"><button class="btn p" data-a="mx">Cố lên.</button></div>`);
      S.hp=50;S.sp=Math.max(30,S.sp);
      S.day++;S.period=0;
      S.periodActionsLeft=ACTIONS_PER_PERIOD;
      S.dayActionsLeft=ACTIONS_PER_DAY;
      S.rolledToday=false;S.logDay=[];
      checkWeekLimit();saveNow();drawAll();
    },400);
    return;
  }
  if(S.hp<=0) S.hp=30;

  // Random event
  const ev=maybeRandomEvent();
  if(ev){
    saveNow();drawAll();
    setTimeout(()=>showChoiceEvent(ev,()=>{saveNow();drawAll();}),200);
    return;
  }

  checkAchievements();
  saveNow();drawAll();
}

/* ====== MINIGAME VIẾT LUẬN ====== */
function normalizeText(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'').trim();
}

function startWritingMinigame(baseReward){
  const list=MINIGAME_SENTENCES[S.ch]||MINIGAME_SENTENCES[1];
  const sentence=list[Math.floor(Math.random()*list.length)];

  T.mgActive=true;T.mgSentence=sentence;T.mgStart=performance.now();T.mgBase=baseReward;

  modal(`
    <h2>✍️ Viết luận</h2>
    <div class="body" style="text-align:center;font-size:12px;margin-bottom:8px">
      Gõ lại câu sau trong <b>10 giây</b>:

    </div>
    <div style="height:8px;background:rgba(26,20,40,.1);border-radius:4px;margin-top:4px;overflow:hidden">
      <div id="mgBar"></div>
    </div>

      <button class="b2 p" data-a="mgSubmit" style="flex:2">✅ Nộp bài</button>
    </div>
  `);

  const input=document.getElementById('mgInput');
  if(input) input.focus();

  T.mgInterval=setInterval(()=>{
    const elapsed=performance.now()-T.mgStart;
    const remain=Math.max(0,10000-elapsed);
    const timerEl=document.getElementById('mgTimer');
    const barEl=document.getElementById('mgBar');
    if(timerEl) timerEl.textContent=`⏱️ ${(remain/1000).toFixed(1)}s`;
    if(barEl){
      barEl.style.width=(remain/100)+'%';
      if(remain<3000) barEl.className='danger';
      else if(remain<5000) barEl.className='warn';
      else barEl.className='';
    }
    if(remain<=0){
      clearInterval(T.mgInterval);
      submitMinigame(10000,false);
    }
  },100);

  if(input){
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        clearInterval(T.mgInterval);
        submitMinigame(performance.now()-T.mgStart,false);
      }
    });
  }
}

function submitMinigame(elapsed,skipped){
  if(!T.mgActive) return;
  T.mgActive=false;

  const input=document.getElementById('mgInput');
  const answer=input?input.value:'';
  const target=T.mgSentence;
  const base=T.mgBase;

  if(skipped){
    const reward=base*0.7;
    S.lu=cl(S.lu+reward,0,100);
    addLog(`✍️ Viết luận (bỏ qua): +${reward.toFixed(1)}% luận văn`);
    mclose();
    setTimeout(()=>{
      modal(`<h2>⏭️ Bỏ qua</h2>
        <div class="body" style="text-align:center">Nhận <b>70%</b>: <b>+${reward.toFixed(1)}%</b> luận văn.</div>
        <div class="mb"><button class="btn p" data-a="mx">OK</button></div>`);
      afterWriteAction();
    },200);
    return;
  }

  const userNorm=normalizeText(answer);
  const targetNorm=normalizeText(target.cn);
  const pyNorm=normalizeText(target.py);
  const correct=(userNorm===targetNorm)||(userNorm===pyNorm);

  let multiplier=0,msg='',ico='';
  if(!correct){multiplier=-0.2;msg='Gõ sai rồi!';ico='❌';beep(300,.2);}
  else if(elapsed<5000){multiplier=1.0;msg='Xuất sắc! Viết cực nhanh!';ico='🌟';beep(1200,.15);}
  else if(elapsed<8000){multiplier=0.5;msg='Tốt lắm!';ico='✅';beep(900,.12);}
  else {multiplier=0;msg='Chậm một chút.';ico='⏰';beep(600,.1);}

  const finalReward=base*(1+multiplier);
  S.lu=cl(S.lu+finalReward,0,100);
  addLog(`✍️ Viết luận: ${finalReward>=0?'+':''}${finalReward.toFixed(1)}% luận văn`);

  mclose();
  setTimeout(()=>{
    modal(`<h2>${ico} ${msg}</h2>
      <div class="body" style="text-align:center">
        ${correct?`Thời gian: <b>${(elapsed/1000).toFixed(1)}s</b><br>`:`Câu đúng: <b>${target.cn}</b><br>`}
        Luận văn: <b style="color:${finalReward>=0?'#3a8a70':'#c92e72'}">${finalReward>=0?'+':''}${finalReward.toFixed(1)}%</b>
      </div>
      <div class="mb"><button class="btn p" data-a="mx">OK</button></div>`);
    afterWriteAction();
  },200);
}

  S.hp=cl(S.hp-15,0,100);

  saveNow();drawAll();
}

/* ====== PERIOD / DAY / WEEK ====== */
function nextPeriod(){
  if(S.period>=2){endDay();return}
  S.period++;
  S.periodActionsLeft=ACTIONS_PER_PERIOD;
  saveNow();drawAll();
}

function endDay(){
   // Xử lý flag effects (cold_risk, poor_sleep)
  applyFlagEffects();
  // Trừ tiền thuê nhà Ch.2 theo tuần (chỉ trừ đầu tuần)
  if(S.day%7==0){endWeek();return}
  S.day++;
  S.period=0;
  S.periodActionsLeft=ACTIONS_PER_PERIOD;
  S.dayActionsLeft=ACTIONS_PER_DAY;
  S.rolledToday=false;
  S.logDay=[];
  S.hp=cl(S.hp+2,0,100);

function endWeek(){
  // Trợ cấp
  const scholar=SCHOLAR[S.ch];
  const before=S.money;
  S.money+=scholar;

  // Thuê nhà Ch.2
  let rent=0;
  if(RENT_PER_WEEK[S.ch]>0){
    rent=RENT_PER_WEEK[S.ch];
    S.money-=rent;
  }

  const wLog={week:S.week,ch:S.ch,year:S.year,yearWeek:S.yearWeek,moneyAfter:S.money,
    scholar,rent,lu:S.lu,hp:S.hp,sp:S.sp};
  S.logWeek.push(wLog);
  if(S.logWeek.length>80) S.logWeek.shift();

  S.week++;
  S.day++;
  S.period=0;
  S.periodActionsLeft=ACTIONS_PER_PERIOD;
  S.dayActionsLeft=ACTIONS_PER_DAY;
  S.rolledToday=false;
  S.logDay=[];
  S.yearWeek++;

  let newYear=false;
  if(S.yearWeek>WEEKS_PER_YEAR){
    // End of year
    S.yearWeek=1;
    S.year++;
    newYear=true;
    S.bigEventsThisYear=[];
    S.lotteryDoneThisYear=false;
    S.culturalEventThisYear=null;
  }

  saveNow();

  const delta=S.money-before;
  const weeksLeft=Math.max(0,MAX_WEEKS[S.ch]-S.week+1);

  // Modal tổng kết tuần
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>

/* ====== ACHIEVEMENTS ====== */
function getAch(){
  try{return JSON.parse(localStorage.getItem(ACH_KEY))||{}}
  catch(e){return {}}
}
function unlockAch(id){
  const ach=getAch();
  if(ach[id]) return false;
  ach[id]=Date.now();
  try{localStorage.setItem(ACH_KEY,JSON.stringify(ach))}catch(e){}
  const info=ACHIEVEMENTS.find(a=>a.id===id);
  if(info){
    toast(`${info.ico} ACHIEVEMENT! ${info.name}`,'ach');
    beep(1200,.15);
  }
  return true;
}
function checkAchievements(forceId){
  if(forceId) return unlockAch(forceId);
  if(S.day>1) unlockAch('a_first_action');
  if(S.week>1) unlockAch('a_first_week');
  if(S.week>4) unlockAch('a_first_month');
  if(S.year>1) unlockAch('a_first_year');
  if(S.ch===2) unlockAch('a_ch1_done');
  if(S.money>10000) unlockAch('a_rich');
  if(S.money>50000) unlockAch('a_rich2');
  if(S.money<100) unlockAch('a_poor');
  if(S.hp<20) unlockAch('a_hungry');
  if(S.sp<20) unlockAch('a_sad');
  const evCount=Object.keys(S.seenEvents||{}).length;
  if(evCount>=10) unlockAch('a_event_10');
  if((S.flags.nightWrites||0)>=10) unlockAch('a_night_owl');
  if(S.flags.linh_stayed) unlockAch('a_linh_friend');
  if(S.flags.hoa_friend) unlockAch('a_hoa_friend');
  if(S.flags.resilient) unlockAch('a_resilient');
  if(S.flags.pride) unlockAch('a_pride');
  if(S.endReason==='grad' && S.hp>80 && S.sp>80 && S.money>20000) unlockAch('a_perfect');
}

/* ====== NOTES ====== */
function saveNote(){
  const tb=$('#noteBox');
  if(!tb) return;
  const txt=tb.value.trim();
  if(!txt) return toast('Chưa viết gì');
  const todayKey=S.ch+'-'+S.week+'-'+S.day;
  if(!S.notes) S.notes=[];
  const i=S.notes.findIndex(n=>n.k===todayKey);
  const entry={k:todayKey,c:S.ch,w:S.week,d:S.day,t:txt,ts:Date.now()};
  if(i>=0) S.notes[i]=entry; else S.notes.push(entry);
  if(S.notes.length>300) S.notes=S.notes.slice(-300);
  if(S.notes.length>=10) unlockAch('a_note_10');
  if(S.notes.length>=50) unlockAch('a_note_50');
  saveNow();toast('📝 Đã lưu note!');openLog();
}
function delNote(k){
  if(!S.notes) return;
  if(!confirm('Xoá note này?')) return;
  S.notes=S.notes.filter(n=>n.k!==k);
  saveNow();toast('🗑️ Đã xoá');openLog();
}

/* ====== EVENTS ====== */
document.addEventListener('click',e=>{
  const target=e.target.closest('[data-a]');
  if(!target) return;
  const a=target.dataset.a,k=target.dataset.k,idx=target.dataset.idx;
  switch(a){
    case 'do':doAct(k);break;
    case 'next':nextPeriod();break;
    case 'sleep':sleepNow();break;
    case 'latewrite':lateWrite();break;
    case 'lottery':doLottery();break;
    case 'lotteryResult':lotteryResult();break;
    case 'openOffer':openOffer();break;
    case 'pickChoice':pickChoice(parseInt(idx));break;
    case 'log':openLog();break;
    case 'book':openBook();break;
    case 'record':openRecord();break;
    case 'ach':openAch();break;
    case 'home':finishHome();break;
    case 'closeSheet':closeSheet();break;
    case 'mx':mclose();break;
    case 'help':closeSheet();modal(HELP);break;
    case 'saveNote':saveNote();break;
    case 'delNote':delNote(k);break;
    case 'exportNotes':exportNotes();break;
    case 'save':manualSave();reSheet();break;
    case 'load':manualLoad();break;
    case 'export':exportSave();break;
    case 'import':importSave();break;
    case 'snd':S.snd^=1;saveNow();reSheet();break;
    case 'wipeslot':
      if(!hasSlot()) return toast('📭 Chưa có save');
      if(confirm('Xoá save thủ công?')){deleteSlot();toast('🗑️ Đã xoá');reSheet()}
      break;
    case 'wiperec':
      if(!confirm('Xoá toàn bộ kỷ lục và thống kê?')) return;
      try{localStorage.removeItem(REC_KEY)}catch(e){}
      toast('🗑️ Đã xoá kỷ lục');reSheet();
      break;
    case 'restart':
      if(!confirm('Chơi lại từ đầu?')) return;
      localStorage.removeItem(KEY);
      location.reload();
      break;
    case 'note':
      mclose();
      setTimeout(()=>openLog(),200);
      break;
    case 'afterWeek':afterWeek();break;
    case 'mgSubmit':
      if(!T.mgActive) break;
      clearInterval(T.mgInterval);
      submitMinigame(performance.now()-T.mgStart,false);
      break;
    case 'mgSkip':skipMinigame();break;
  }
});

  // cold_risk: 20% bị cảm sau khi từ chối mua áo
  if(S.flags.cold_risk && !S.flags.cold_resolved){
    S.flags.cold_resolved = true;
    if(Math.random() < 0.2){
      S.hp = cl(S.hp - 15, 0, 100);
      addLog('🤒 Bị cảm vì mặc áo cũ');
      setTimeout(() => toast('⚠️ Bị cảm! −15 HP'), 500);
    }
  }
  
  // poor_sleep: −5 HP mỗi tuần nếu dùng chăn cũ
  if(S.flags.poor_sleep && S.day % 7 === 0){
    S.hp = cl(S.hp - 5, 0, 100);
    addLog('😴 Ngủ không ngon: −5 HP');
  }
  
  // have_cooker: giảm giá ăn 3 tệ/bữa
  // (đã xử lý trong doAct khi check giá ăn)
}

  // Nếu có nồi cơm → giảm 3 tệ
  return S.flags.have_cooker ? Math.max(0, baseCost - 3) : baseCost;
}
