<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#ffb6d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🌸 Vân Khánh Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1428;--ink2:#3a2a4a;--mu:#8a7a9a;
  --shadow:3px 3px 0 var(--ink);--radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:600 13.5px/1.35 "Quicksand",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(circle at 8% 12%,rgba(255,200,220,.5) 0 6px,transparent 7px),
    radial-gradient(circle at 88% 22%,rgba(255,220,240,.45) 0 5px,transparent 6px),
    radial-gradient(circle at 22% 78%,rgba(220,190,240,.4) 0 5px,transparent 6px),
    radial-gradient(circle at 78% 88%,rgba(255,200,220,.4) 0 6px,transparent 7px),
    linear-gradient(160deg,#fff5f9 0%,#fdeef8 25%,#f5ecff 55%,#e8f4ff 85%,#e0f0ff 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 9px calc(env(safe-area-inset-bottom) + 8px);
  position:relative;
}

/* HEADER */
#hd{
  position:relative;border-radius:var(--radius);
  border:2px solid var(--ink);box-shadow:var(--shadow);overflow:hidden;
  background:linear-gradient(155deg,#ffb3d1 0%,#ff8fb8 40%,#c9b6f0 100%);
}
#hd .top{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1.5px solid rgba(26,20,40,.35);
}
#logo{
  flex:none;width:32px;height:32px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);background:#ffc6dd;
}
.logo-wrap{flex:1;min-width:0}
.logo-wrap .t{
  font-family:"Comfortaa","Quicksand",sans-serif;
  font-weight:700;font-size:14px;color:#fff;
  text-shadow:1px 1px 0 rgba(26,20,40,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logo-wrap .t small{
  display:block;font-size:8.5px;opacity:.9;letter-spacing:1.5px;
  font-weight:700;margin-top:1px;color:#fff;
  text-shadow:1px 1px 0 rgba(26,20,40,.5);
}

/* 4 stats vuông */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:5px;padding:8px 10px 10px;
}
.stat-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.95);
  border:2px solid var(--ink);border-radius:9px;
  padding:5px 3px 4px;
  box-shadow:1.5px 1.5px 0 var(--ink);
  min-width:0;
}
.stat-cell .lbl{
  font-size:9px;font-weight:800;letter-spacing:.3px;
  text-transform:uppercase;line-height:1;
  display:flex;align-items:center;gap:2px;
}
.stat-cell .val{
  font-family:"Comfortaa",sans-serif;
  font-size:15px;font-weight:800;line-height:1.1;
  margin:3px 0 3px;
}
.stat-cell .bar-mini{
  width:100%;height:5px;border-radius:3px;
  background:rgba(26,20,40,.12);
  border:1.5px solid var(--ink);
  overflow:hidden;position:relative;
}
.stat-cell .bar-mini i{
  display:block;height:100%;width:0;transition:width .35s;
}
.stat-cell.hp .bar-mini i{background:linear-gradient(90deg,#ffb3c1,#ff6b9d)}
.stat-cell.sp .bar-mini i{background:linear-gradient(90deg,#ffe4a8,#ffb84d)}
.stat-cell.lu .bar-mini i{background:linear-gradient(90deg,#c9b6f0,#a890e0)}
.stat-cell.money .sub{
  font-size:9px;font-weight:700;color:var(--mu);
  line-height:1;
}
.stat-cell.money .val{font-size:13px;margin-bottom:0}

/* SCENE */
#scene{
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  border:2px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);min-height:0;background:#fff;
}
.ch1 #scene{background:linear-gradient(180deg,#ffe9c9 0 40px,#fff8ee 40px)}
.ch2 #scene{background:linear-gradient(180deg,#a8c8e8 0 40px,#f0f8ff 40px)}
#top-info{text-align:center;padding:8px 12px 6px}
#top-info .date{font-family:"Comfortaa",sans-serif;font-size:14px;font-weight:700}
#top-info .weekday{font-size:11px;font-weight:700;color:var(--ink2);margin-top:1px}
#top-info .period{
  display:inline-block;margin-top:6px;padding:4px 16px;
  border:2px solid var(--ink);border-radius:20px;
  background:rgba(255,255,255,.85);font-size:12px;font-weight:800;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#avatar-w{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 12px;min-height:0;
}
#avatar{
  width:82px;height:82px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  background:#ffc6dd;margin-bottom:7px;
}
#mood{
  font-size:12px;font-weight:700;text-align:center;padding:4px 14px;
  background:rgba(255,255,255,.85);
  border:2px solid var(--ink);border-radius:20px;
  box-shadow:1.5px 1.5px 0 var(--ink);max-width:92%;
}
#notice{
  display:none;margin:6px 10px 0;padding:6px 10px;
  border:2px solid var(--ink);border-radius:10px;
  background:linear-gradient(180deg,#fff3c9,#ffe0a0);
  box-shadow:2px 2px 0 var(--ink);
  font-size:11px;font-weight:700;line-height:1.4;
}
#notice.on{display:block}
#log{
  margin:6px 10px 10px;padding:6px 10px;
  background:rgba(255,255,255,.9);
  border:1.5px solid var(--ink);border-radius:10px;
  font-size:11px;line-height:1.5;
  max-height:64px;overflow:hidden;min-height:40px;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#log .ln{display:block}
#log .ln::before{content:"· ";opacity:.5;font-weight:800}

#acts-wrap{
  border:2px solid var(--ink);border-radius:var(--radius);
  background:#fff;box-shadow:var(--shadow);padding:10px;
}
#period-lbl{
  text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.5px;
  margin-bottom:8px;padding-bottom:6px;
  border-bottom:1.5px dashed rgba(26,20,40,.3);
}
#acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.act{
  position:relative;
  border:2px solid var(--ink);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:12px;line-height:1.15;
  height:clamp(58px,7.4vh,72px);
  background:linear-gradient(180deg,#fff,#f5f0ff);
  color:var(--ink);padding:3px;
  box-shadow:2px 2px 0 var(--ink);transition:transform .1s;
}
.act b{font-size:24px;line-height:1.1;margin-bottom:3px;font-weight:400}
.act span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.act.dis{opacity:.42;filter:grayscale(.7)}
.act.hoc{background:linear-gradient(180deg,#c9f2df,#a8e6d0)}
.act.lam{background:linear-gradient(180deg,#ffeec4,#ffe4a8)}
.act.viet{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff}
.act.choi{background:linear-gradient(180deg,#ffc6dd,#ff9bbf);color:#fff}
.act.ngu{background:linear-gradient(180deg,#c9b6f0,#a890e0);color:#fff}
.act.an{background:linear-gradient(180deg,#ffd1dc,#ffb3c6)}

#nextBtn{
  width:100%;margin-top:8px;padding:11px;
  border:2px solid var(--ink);border-radius:10px;
  font-family:"Comfortaa",sans-serif;
  font-size:13px;font-weight:800;
  background:linear-gradient(180deg,#a8e6d0,#7ecbaf);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.4);
  box-shadow:2px 2px 0 var(--ink);letter-spacing:.5px;
}
#nextBtn:disabled{
  background:linear-gradient(180deg,#e8e2f0,#d8d0e5);
  color:var(--mu);text-shadow:none;opacity:.7;
}
#nextBtn:not(:disabled):active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

.fab{
  position:fixed;width:56px;height:56px;
  border-radius:50%;border:2px solid var(--ink);
  color:#fff;font-size:24px;
  display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink);
  z-index:20;transition:transform .15s;
}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fab::after{
  content:attr(data-label);
  position:absolute;bottom:-16px;
  font-size:9px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.9);padding:1px 6px;
  border-radius:6px;border:1.5px solid var(--ink);white-space:nowrap;
}
#sleepFab{right:14px;bottom:calc(env(safe-area-inset-bottom) + 130px);background:linear-gradient(180deg,#c9b6f0,#a890e0)}
#writeFab{right:14px;bottom:calc(env(safe-area-inset-bottom) + 196px);background:linear-gradient(180deg,#ff9bbf,#ff6b9d);display:none}
#writeFab.on{display:grid}
@media (min-width:520px){
  #sleepFab,#writeFab{right:calc(50% - 240px + 14px)}
}

#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#nav button{
  border:2px solid var(--ink);border-radius:10px;
  font-size:10.5px;font-weight:800;padding:8px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(180deg,#fff,#f5eeff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#nav button b{font-size:16px;line-height:1;font-weight:400}
#nav button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

#sheet{
  position:fixed;inset:0;z-index:50;background:rgba(26,20,40,.55);
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.shx{
  width:100%;max-width:480px;max-height:82vh;overflow:auto;
  border:2px solid var(--ink);border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:#fff;box-shadow:0 -6px 0 var(--ink);
  animation:sup .28s cubic-bezier(.2,1.3,.5,1);
}
@keyframes sup{from{transform:translateY(100%)}}
.shh{
  display:flex;align-items:center;font-size:16px;font-weight:800;
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.shh b{flex:1}
h3{
  margin:14px 0 6px;font-size:13.5px;font-weight:800;
  display:flex;align-items:center;gap:6px;
  font-family:"Comfortaa",sans-serif;
}
h3::before{content:"✿";color:#ff6b9d;font-size:16px}
.it{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1.5px solid var(--ink);border-radius:9px;
  background:#fff;box-shadow:1.5px 1.5px 0 var(--ink);
  margin-bottom:6px;
}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:12.5px}
.it small{display:block;color:var(--ink2);font-weight:600;margin-top:2px;font-size:11px}
.bs{display:flex;gap:6px;flex-wrap:wrap}
.b2{
  border:2px solid var(--ink);border-radius:9px;
  padding:7px 12px;font-weight:800;font-size:12px;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f0eaff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
}
.b2.p{background:linear-gradient(180deg,#ffb3d1,#ff8fb8);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2.g{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.b2:disabled{opacity:.45;filter:grayscale(.5)}

#modal{
  position:fixed;inset:0;z-index:60;background:rgba(26,20,40,.6);
  display:grid;place-items:center;padding:16px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.bx{
  width:100%;max-width:420px;max-height:88vh;overflow:auto;
  border:2px solid var(--ink);border-radius:18px;
  padding:20px;background:#fff;
  box-shadow:6px 6px 0 var(--ink);
  animation:pp .28s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pp{from{transform:scale(.88);opacity:0}}
.bx h2{
  margin:0 0 12px;text-align:center;font-size:19px;
  padding-bottom:8px;border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.bx .body{font-size:13px;line-height:1.6}
.bx .body b{color:#ff6b9d}
.ev{
  background:linear-gradient(180deg,#fff8e0,#ffeec0);
  border:2px solid var(--ink);border-radius:10px;
  padding:10px 12px;margin:8px 0;
  box-shadow:2px 2px 0 var(--ink);
}
.g2{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:12.5px}
.mb{display:grid;gap:10px;margin-top:14px}
.mb2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sp{display:flex;justify-content:center;margin:8px 0 6px}
.sp img{
  width:80px;height:80px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  background:#ffc6dd;
}
#toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);
  z-index:70;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none;
}
#toast div{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;border:2px solid var(--ink);border-radius:12px;
  padding:8px 14px;text-align:center;font-weight:800;font-size:12.5px;
  box-shadow:3px 3px 0 var(--ink);
  text-shadow:1px 1px 0 rgba(26,20,40,.3);
}

#noteBox{
  width:100%;min-height:80px;
  border:2px solid var(--ink);border-radius:10px;
  padding:8px 10px;
  font:600 12.5px/1.5 "Quicksand",sans-serif;
  color:var(--ink);background:#fff;
  box-shadow:inset 1.5px 1.5px 0 rgba(26,20,40,.1);
  resize:vertical;
  -webkit-user-select:text;user-select:text;
}
#noteBox:focus{outline:none;border-color:#ff6b9d}
.noteIt{
  border:1.5px solid var(--ink);border-radius:9px;
  background:linear-gradient(180deg,#fffdf5,#fff8e0);
  box-shadow:1.5px 1.5px 0 var(--ink);
  padding:8px 10px;margin-bottom:6px;
}
.noteIt .hd{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:800;color:#8a5a00;
  margin-bottom:4px;
}
.noteIt .ct{
  font-size:12.5px;font-weight:600;color:var(--ink);
  line-height:1.5;white-space:pre-wrap;word-break:break-word;
}
.noteIt .del{
  border:1.5px solid var(--ink);border-radius:6px;
  background:#fff;font-size:10px;font-weight:800;
  padding:2px 6px;color:#c92e72;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body class="ch1">
<div id="app">
  <header id="hd">
    <div class="top">
      <img id="logo" src="icon-192.png" alt="Vân Khánh">
      <div class="logo-wrap">
        <div class="t">Vân Khánh Diary<small id="chapLbl">✿ THẠC SĨ · CNU BẮC KINH ✿</small></div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-cell hp">
        <div class="lbl">⚡ HP</div>
        <div class="val" id="hpV">80</div>
        <div class="bar-mini"><i id="hpB"></i></div>
      </div>
      <div class="stat-cell sp">
        <div class="lbl">💗 SP</div>
        <div class="val" id="spV">70</div>
        <div class="bar-mini"><i id="spB"></i></div>
      </div>
      <div class="stat-cell lu">
        <div class="lbl">📝 Luận</div>
        <div class="val" id="lvV">0%</div>
        <div class="bar-mini"><i id="lvB"></i></div>
      </div>
      <div class="stat-cell money">
        <div class="lbl">💰 Tiền</div>
        <div class="val" id="moneyV">500</div>
        <div class="sub" id="weekV2">Tuần 1/36</div>
      </div>
    </div>
  </header>

  <section id="scene">
    <div id="top-info">
      <div class="date" id="dateV">Ngày 1 · Tuần 1/36</div>
      <div class="weekday" id="weekV">Thứ Hai · còn 36 tuần</div>
      <div class="period" id="periodV">🌅 Buổi sáng</div>
    </div>
    <div id="notice"></div>
    <div id="avatar-w">
      <img id="avatar" src="icon-192.png" alt="Vân Khánh">
      <div id="mood">Vân Khánh đang chuẩn bị cho ngày mới.</div>
    </div>
    <div id="log"><span class="ln" style="opacity:.55">Nhật ký sẽ ghi lại ở đây...</span></div>
  </section>

  <div id="acts-wrap">
    <div id="period-lbl">NGÀY 1 · CÒN 2 HÀNH ĐỘNG</div>
    <div id="acts"></div>
    <button id="nextBtn" data-a="next" disabled>➡️ SANG BUỔI CHIỀU</button>
    <nav id="nav">
      <button data-a="log"><b>📖</b>Nhật ký</button>
      <button data-a="book"><b>📔</b>Sổ tay</button>
      <button data-a="record"><b>🏆</b>Kỷ lục</button>
      <button data-a="home"><b>🏠</b>Về nhà</button>
    </nav>
  </div>
</div>

<button id="sleepFab" class="fab" data-a="sleep" data-label="Ngủ đêm">🌙</button>
<button id="writeFab" class="fab" data-a="latewrite" data-label="Thức đêm">🌌</button>

<div id="sheet" class="hide"><div class="shx"><div class="shh"><b id="sht"></b><button class="b2" data-a="closeSheet">✕</button></div><div id="shb"></div></div></div>
<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const F=n=>Math.round(n).toLocaleString('vi-VN');

const KEY='vkdiary_v12';
const SLOT='vkdiary_slot_v12';
const REC_KEY='vkdiary_rec_v12';
const SAVE_VER=12;
const SCHOLAR=[0,750,875];
const START_MONEY=500;
const MAX_WEEKS=[0,36,72];
const WRITE_RATE=[0,1.5,1.2];      // viết luận: MS 1.5, TS 1.2
const FIX_RATE=[0,0.8,0.6];        // sửa lỗi
const MEET_RATE=[0,0.5,0.4];       // gặp GV
const LIB_RATE=[0,0.5,0.4];        // thư viện / lab
const NIGHT_RATE=[0,1.0,0.8];      // thức đêm
const ACTIONS_PER_DAY=2;
const STIPEND_WEEKS=[0,24,60];

const WD=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const PERIODS=['🌅 Buổi sáng','☀️ Buổi chiều','🌙 Buổi tối'];

/* 6 action mỗi buổi — không hiển thị +/- ở nút */
const ACTS=[
  /* 🌅 SÁNG */
  {k:'s_tv', n:'Thư viện',   e:'📚', p:0, hp:-6, sp:-12, lu:'lib', grp:'hoc'},
  {k:'s_lab',n:'Lab thầy',   e:'🧪', p:0, hp:-5, sp:+2,  lu:'lib', grp:'hoc'},

      try{

        if(!o||!o.data) return toast('❌ File không hợp lệ');

function saveNote(){

  if(!txt) return toast('Chưa viết gì');
  const todayKey=S.ch+'-'+S.week+'-'+S.day;
  if(!S.notes) S.notes=[];
  const i=S.notes.findIndex(n=>n.k===todayKey);
  const entry={k:todayKey,c:S.ch,w:S.week,d:S.day,t:txt,ts:Date.now()};
  if(i>=0) S.notes[i]=entry;
  else S.notes.push(entry);
  if(S.notes.length>300) S.notes=S.notes.slice(-300);
  save();toast('📝 Đã lưu note!');openLog();
}

let AC=null;
function beep(f=600,d=.1){
  if(!S.snd) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.04,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

function drawActs(){
  const period=S.period;
  const list=ACTS.filter(a=>a.p==period);
  const noLeft=S.actionsLeft<=0;
  const done=noLeft;
  setTxt('period-lbl',`${WD[(S.day-1)%7].toUpperCase()} · NGÀY ${S.day} · CÒN ${S.actionsLeft}/${ACTIONS_PER_DAY} HÀNH ĐỘNG`);
  const html=[];
  for(let i=0;i<list.length;i++){
    const a=list[i];
    const clsMap={hoc:'hoc',lam:'lam',viet:'viet',choi:'choi',ngu:'ngu',an:'an'};
    let cls=clsMap[a.grp]||'';
    let dis=false;
    if(done) dis=true;
    if(a.m<0 && S.money<-a.m) dis=true;
    if(a.k=='c_wr' && S.lu>=100) dis=true;
    if(dis) cls+=' dis';
    html.push(`<button class="act ${cls}" data-a="do" data-k="${a.k}" ${dis?'disabled':''}>
      <b>${a.e}</b><span>${a.n}</span>
    </button>`);
  }
  const actsEl=$('#acts');
  const h=html.join('');
  if(actsEl._h!==h){actsEl._h=h;actsEl.innerHTML=h}

  const nb=$('#nextBtn');
  if(S.actionsLeft<=0){
    nb.textContent='🌙 KẾT THÚC NGÀY';
  } else {
    if(S.period==0) nb.textContent='➡️ SANG BUỔI CHIỀU';
    else if(S.period==1) nb.textContent='➡️ SANG BUỔI TỐI';
    else nb.textContent='🌙 KẾT THÚC NGÀY';
  }
  nb.disabled=!done && S.actionsLeft>0 ? false : (S.actionsLeft<=0);

  const wf=$('#writeFab');
  if(S.week>=STIPEND_WEEKS[S.ch] && S.lu<100) wf.classList.add('on');
  else wf.classList.remove('on');
}

function maybeRandomEvent(){
  if(S.rolledToday) return null;
  if(Math.random()>0.4) return null;
  S.rolledToday=true;
  const isGood=Math.random()<0.5;
  const pool=isGood?GOOD:BAD;
  const idx=Math.floor(Math.random()*pool.length);
  return Object.assign({kind:isGood?'good':'bad',idx},pool[idx]);
}
function applyEvent(ev){
  if(!S.seenEvents) S.seenEvents={};
  if(ev.idx!==undefined) S.seenEvents[(ev.kind==='good'?'g':'b')+ev.idx]=1;
  if(ev.hp) S.hp=cl(S.hp+ev.hp,0,100);
  if(ev.sp) S.sp=cl(S.sp+ev.sp,0,100);
  if(ev.m)  S.money+=ev.m;
  if(ev.lu) S.lu=cl(S.lu+ev.lu,0,100);
  addLog(`${ev.e}: ${ev.t}`);
}

  modal(`<h2>${ev.e}</h2>
    <div class="body" style="text-align:center">${ev.t}</div>

function maybeOffer(){
  if(S.pendingOffer||S.pendingBigEvent) return;
  if(Math.random()>0.15) return;
  const list=OFFERS.filter(o=>{
    if(o.onceMonth && S.travelMonth===Math.floor(S.week/4)) return false;
    return true;
  });
  if(!list.length) return;
  const o=list[Math.floor(Math.random()*list.length)];
  S.pendingOffer=Object.assign({},o);
  save();
}
function acceptOffer(){
  if(!S.pendingOffer) return;
  const o=S.pendingOffer;
  if(o.m<0 && S.money<-o.m) return toast('❌ Không đủ tiền');
  if(o.m) S.money+=o.m;
  if(o.sp) S.sp=cl(S.sp+o.sp,0,100);
  if(o.hp) S.hp=cl(S.hp+o.hp,0,100);
  if(o.lu) S.lu=cl(S.lu+o.lu,0,100);
  if(o.onceMonth) S.travelMonth=Math.floor(S.week/4);
  if(!S.seenEvents) S.seenEvents={};
  S.seenEvents['o'+OFFERS.findIndex(x=>x.k===o.k)]=1;
  addLog(`${o.e}: ${o.t}`);
  S.pendingOffer=null;
  save();drawAll();
  toast('✅ Đã tham gia!');
}
function declineOffer(){
  if(!S.pendingOffer) return;
  addLog(`😔 Từ chối: ${S.pendingOffer.e}`);
  S.pendingOffer=null;
  save();drawAll();
}

/* Event lớn — mất cả ngày */
function maybeBigEvent(){
  if(S.pendingBigEvent) return;
  const be=BIG_EVENTS.find(ev=>ev.ch===S.ch && ev.week===S.week && !S.seenEvents['be_'+ev.k]);
  if(!be) return;
  S.pendingBigEvent=Object.assign({},be);
  save();
}
function acceptBig(){
  if(!S.pendingBigEvent) return;
  const be=S.pendingBigEvent;
  if(S.money<be.cost) return toast('❌ Không đủ tiền');
  S.money-=be.cost;
  if(be.hp) S.hp=cl(S.hp+be.hp,0,100);
  if(be.sp) S.sp=cl(S.sp+be.sp,0,100);
  if(be.lu) S.lu=cl(S.lu+be.lu,0,100);
  if(!S.seenEvents) S.seenEvents={};
  S.seenEvents['be_'+be.k]=1;
  addLog(`${be.e}: ${be.t}`);
  S.pendingBigEvent=null;
  // Mất cả ngày → endDay
  save();
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
    <h2>${be.e}</h2>
    <div class="body">${be.t}</div>
    <div class="ev" style="text-align:center;font-weight:800">
      −${be.cost} tệ ${be.hp?' · +'+be.hp+' HP':''} ${be.sp?' · +'+be.sp+' SP':''} ${be.lu?' · +'+be.lu+'% luận':''}
    </div>
    <div class="mb"><button class="btn p" data-a="bigEnd">Qua ngày mới</button></div>`);
}
function declineBig(){
  if(!S.pendingBigEvent) return;
  addLog(`😔 Bỏ qua: ${S.pendingBigEvent.e}`);
  S.pendingBigEvent=null;
  save();drawAll();
}
function bigEnd(){
  mclose();
  S.actionsLeft=0;
  endDay();
}

function doAct(k){
  if(T.modal) return;
  if(S.actionsLeft<=0) return toast('Hết hành động hôm nay');
  const a=ACTS.find(x=>x.k==k);
  if(!a) return;
  if(a.m<0 && S.money<-a.m) return toast('Không đủ tiền');
  if(a.k=='c_wr' && S.lu>=100) return;

  const eff=lowEff();
  if(a.hp) S.hp=cl(S.hp+Math.round(a.hp*eff),0,100);
  if(a.sp) S.sp=cl(S.sp+Math.round(a.sp*eff),0,100);
  if(a.m) S.money+=a.m;
  if(a.lu){
    let rate=0;
    if(a.lu==='write') rate=WRITE_RATE[S.ch];
    else if(a.lu==='fix') rate=FIX_RATE[S.ch];
    else if(a.lu==='meet') rate=MEET_RATE[S.ch];
    else if(a.lu==='lib') rate=LIB_RATE[S.ch];
    const g=Math.round(rate*eff*10)/10;
    S.lu=cl(S.lu+g,0,100);
    addLog(`${a.e} ${a.n}: +${g}% luận văn`);
  } else if(a.grp=='lam'){
    addLog(`${a.e} ${a.n}: +${a.m} tệ`);
  } else {
    addLog(`${a.e} ${a.n}`);
  }
  S.actionsLeft--;
  beep(a.grp=='viet'?880:a.grp=='choi'?660:520,.08);

  if(S.hp<20 && S.hp>0){
    save();drawAll();
    setTimeout(()=>{
      modal(`<h2>🤒 Vân Khánh ốm</h2>
      <div class="body">HP xuống dưới 20. Cô phải nghỉ ngơi một ngày.</div>
      <div class="mb"><button class="btn p" data-a="mx">Cố lên.</button></div>`);
      S.hp=50;S.sp=Math.max(30,S.sp);
      S.day++;S.period=0;S.actionsLeft=ACTIONS_PER_DAY;S.rolledToday=false;S.logDay=[];
      checkWeekLimit();
      save();drawAll();
    },400);
    return;
  }
  if(S.hp<=0) S.hp=30;

  const ev=maybeRandomEvent();
  if(ev){
    applyEvent(ev);
    save();drawAll();
    setTimeout(()=>showEventModal(ev),200);
    return;
  }
  save();drawAll();
}

function sleepNow(){
  if(T.modal) return;
  if(S.actionsLeft===ACTIONS_PER_DAY){
    if(!confirm('Kết thúc ngày sớm?\nSẽ bỏ qua các hành động còn lại.')) return;
  }
  const bonusActions=S.actionsLeft;
  S.hp=cl(S.hp+18,0,100);
  S.sp=cl(S.sp+35,0,100);
  addLog('🌙 Ngủ đêm');
  endDay();
}

function lateWrite(){
  if(T.modal) return;
  if(S.week<STIPEND_WEEKS[S.ch]) return toast('Chưa mở khóa');
  if(S.lu>=100) return toast('Luận văn đã xong');
  if(S.hp<15) return toast('Quá mệt, không thức được');
  if(!confirm('Thức đêm viết luận?\n−15 HP, −20 SP, +'+NIGHT_RATE[S.ch]+'% luận văn.')) return;
  S.hp=cl(S.hp-15,0,100);
  S.sp=cl(S.sp-20,0,100);
  const g=NIGHT_RATE[S.ch];
  S.lu=cl(S.lu+g,0,100);
  addLog(`🌌 Thức đêm viết: +${g}% luận văn`);
  beep(440,.15);
  save();drawAll();
  if(S.hp<20 && S.hp>0){
    setTimeout(()=>{
      modal(`<h2>🤒 Kiệt sức</h2><div class="body">Thức đêm quá nhiều, Vân Khánh ngất đi.</div><div class="mb"><button class="btn p" data-a="mx">Ôi...</button></div>`);
      S.hp=50;
      S.day++;S.period=0;S.actionsLeft=ACTIONS_PER_DAY;S.rolledToday=false;S.logDay=[];
      save();drawAll();
    },400);
  }
}

function nextPeriod(){
  if(S.actionsLeft<=0){endDay();return}
  if(S.period>=2){endDay();return}
  S.period++;
  save();drawAll();
}

function endDay(){
  if(S.day%7==0){endWeek();return}
  S.day++;
  S.period=0;
  S.actionsLeft=ACTIONS_PER_DAY;
  S.rolledToday=false;
  S.logDay=[];
  S.hp=cl(S.hp+2,0,100);
  S.sp=cl(S.sp+2,0,100);
  checkWeekLimit();
  checkStory();
  save();
  drawAll();
}

function checkWeekLimit(){
  if(S.week>MAX_WEEKS[S.ch]){
    S.endReason='timeout';
    save();
    modal(`<h2>⏰ Quá hạn</h2>
    <div class="body">Vân Khánh đã học quá ${MAX_WEEKS[S.ch]} tuần mà chưa bảo vệ được luận văn. Trường buộc cô thôi học.</div>
    <div class="ev">Cô ngồi trong phòng, nhìn cuốn nhật ký dở dang.</div>

      <button class="btn" data-a="record">🏆 Kỷ lục</button>
      <button class="btn p" data-a="restart">🔄 Chơi lại</button>
    </div>`);
  }
}

function endWeek(){
  const scholar=SCHOLAR[S.ch];
  const before=S.money;
  S.money+=scholar;
  const wLog={week:S.week,ch:S.ch,moneyBefore:before,moneyAfter:S.money,
    scholar,lu:S.lu,hp:S.hp,sp:S.sp};
  S.logWeek.push(wLog);
  if(S.logWeek.length>50) S.logWeek.shift();
  S.week++;
  S.day++;
  S.period=0;
  S.actionsLeft=ACTIONS_PER_DAY;
  S.rolledToday=false;
  S.logDay=[];
  save();
  const delta=S.money-before;
  const weeksLeft=Math.max(0,MAX_WEEKS[S.ch]-S.week+1);
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>📊 TỔNG KẾT TUẦN ${S.week-1}</h2>
  <div class="g2">

    <span>💵 Còn lại</span><b>${F(S.money)} tệ</b>

    <span>⚡ HP / 💗 SP</span><b>${Math.round(S.hp)} / ${Math.round(S.sp)}</b>

    Tuần này Vân Khánh đã ${S.lu>0?`viết được ${S.lu.toFixed(1)}% luận văn`:'chưa viết được gì'}.
    ${S.hp<50?'Cô thấy khá mệt.':''}
    ${S.sp<50?'Tinh thần có chút xuống.':''}
    Hãy ghi lại cảm xúc của mình ở tab Nhật ký nhé!

  setTimeout(()=>maybeBigEvent(),400);

  checkStory();

    <td style="padding:5px;border:1px solid var(--ink);text-align:center;color:#c92e72">−20 SP</td></tr>
    </table>
    <div style="font-size:11px;color:var(--mu);margin-top:4px">Thức đêm: +${NIGHT_RATE[S.ch]}% luận văn</div>`;

  const seen=S.seenEvents||{};
  html+='<h3>🎲 Event ngẫu nhiên</h3>';
  html+='<div style="font-size:11px;color:var(--mu);margin-bottom:6px">Mỗi ngày tối đa 1 event. Cái nào đã gặp sẽ hiện rõ, chưa gặp thì ẩn.</div>';

  html+='<div style="font-size:11.5px;font-weight:800;margin:8px 0 4px;color:#c92e72">💀 XẤU (20%)</div>';
  BAD.forEach((ev,i)=>{
    if(seen['b'+i]){
      html+=`<div class="noteIt" style="background:linear-gradient(180deg,#fff0f5,#ffe0e8)">
        <div class="hd" style="color:#c92e72"><span>${ev.e}</span></div>
        <div class="ct">${ev.t}</div>
        <div style="font-size:11px;margin-top:4px;font-weight:800;color:#c92e72">
          ${ev.hp?`HP ${ev.hp} `:''}${ev.sp?`SP ${ev.sp} `:''}${ev.m?`${ev.m} tệ `:''}${ev.lu?`Luận ${ev.lu}%`:''}
        </div></div>`;
    } else {
      html+=`<div class="noteIt" style="background:rgba(200,180,220,.15);opacity:.55">
        <div class="hd" style="color:var(--mu)"><span>❓ Ẩn</span></div>
        <div class="ct" style="color:var(--mu);font-style:italic">Chưa gặp event này</div>
      </div>`;
    }
  });

  html+='<div style="font-size:11.5px;font-weight:800;margin:10px 0 4px;color:#3a8a70">🌸 TỐT (20%)</div>';
  GOOD.forEach((ev,i)=>{
    if(seen['g'+i]){
      html+=`<div class="noteIt" style="background:linear-gradient(180deg,#f0fff5,#d8f5e3)">
        <div class="hd" style="color:#3a8a70"><span>${ev.e}</span></div>
        <div class="ct">${ev.t}</div>
        <div style="font-size:11px;margin-top:4px;font-weight:800;color:#3a8a70">
          ${ev.hp?`HP +${ev.hp} `:''}${ev.sp?`SP +${ev.sp} `:''}${ev.m?`+${ev.m} tệ `:''}${ev.lu?`Luận +${ev.lu}%`:''}
        </div></div>`;
    } else {
      html+=`<div class="noteIt" style="background:rgba(200,180,220,.15);opacity:.55">
        <div class="hd" style="color:var(--mu)"><span>❓ Ẩn</span></div>
        <div class="ct" style="color:var(--mu);font-style:italic">Chưa gặp event này</div>
      </div>`;
    }
  });

  html+=`<div class="ev" style="font-size:11.5px;margin-top:12px">
    💡 Bạn đã gặp <b>${Object.keys(seen).filter(k=>k[0]!=='o'&&k.slice(0,3)!=='be_').length}/${BAD.length+GOOD.length}</b> event.
  </div>`;

  html+='<h3>🎁 Offer & Event lớn</h3>';
  html+='<div style="font-size:11px;color:var(--mu);margin-bottom:6px">Offer báo trước, có thể chọn. Event lớn (bố mẹ qua, hội thảo) mất nguyên ngày.</div>';
  OFFERS.forEach((o,i)=>{
    if(seen['o'+i]){
      html+=`<div class="noteIt">
        <div class="hd"><span>${o.e}</span></div>
        <div class="ct">${o.t}</div>
        <div style="font-size:11px;margin-top:4px;font-weight:800">
          ${o.m} tệ ${o.sp?` · +${o.sp} SP`:''} ${o.hp?` · +${o.hp} HP`:''} ${o.lu?` · +${o.lu}% luận`:''}
        </div></div>`;
    } else {
      html+=`<div class="noteIt" style="background:rgba(200,180,220,.15);opacity:.55">
        <div class="hd" style="color:var(--mu)"><span>❓ Ẩn</span></div>
        <div class="ct" style="color:var(--mu);font-style:italic">Chưa gặp offer này</div>
      </div>`;
    }
  });
  BIG_EVENTS.forEach((ev,i)=>{
    if(seen['be_'+ev.k]){
      html+=`<div class="noteIt" style="background:linear-gradient(180deg,#fff5e0,#ffe4c0)">
        <div class="hd"><span>${ev.e}</span></div>
        <div class="ct">${ev.t}</div>
        <div style="font-size:11px;margin-top:4px;font-weight:800">
          −${ev.cost} tệ ${ev.hp?` · +${ev.hp} HP`:''} ${ev.sp?` · +${ev.sp} SP`:''} ${ev.lu?` · +${ev.lu}% luận`:''}
        </div></div>`;
    } else {
      html+=`<div class="noteIt" style="background:rgba(200,180,220,.15);opacity:.55">
        <div class="hd" style="color:var(--mu)"><span>❓ Ẩn</span></div>
        <div class="ct" style="color:var(--mu);font-style:italic">Event cốt truyện — mở ở Chương ${ev.ch} tuần ${ev.week}</div>
      </div>`;
    }
  });

  $('#shb').innerHTML=html;
  $('#sheet').classList.remove('hide');
}

function openRecord(){
  T.sheet='record';
  setTxt('sht','🏆 Kỷ lục');
  const r=getRec();
  const fin=(r.fin||[]).slice().reverse().slice(0,5);
  $('#shb').innerHTML=`
    <div class="ev"><b>Kỷ lục tốt nhất</b>
    <div class="g2" style="margin-top:6px">
      <span>🥇 Chương 1</span><b>${r.b1?r.b1+' ngày':'—'}</b>
      <span>🥇 Chương 2</span><b>${r.b2?r.b2+' ngày':'—'}</b>
      <span>🥇 Tổng</span><b>${r.bT?r.bT+' ngày':'—'}</b>
    </div></div>
    <h3>Lần gần đây</h3>
    ${fin.length? fin.map(f=>`<div class="it"><div class="m"><b>Tổng ${f.t} ngày</b><small>C1: ${f.c1} · C2: ${f.c2}</small></div></div>`).join('') : '<div class="sm mu">Chưa hoàn thành.</div>'}
    <h3>💾 Save</h3>
    <div class="bs" style="margin-bottom:8px">
      <button class="b2 p" data-a="save">💾 Lưu</button>
      <button class="b2 ${hasSlot()?'g':''}" data-a="load" ${hasSlot()?'':'disabled'}>📂 Tải</button>
      <button class="b2" data-a="export">⬇️ Xuất</button>
      <button class="b2" data-a="import">⬆️ Nhập</button>
    </div>
    <div class="bs" style="margin-top:8px">
      <button class="b2" data-a="snd">🔊 ${S.snd?'Bật':'Tắt'}</button>
      <button class="b2" data-a="help">❓ Hướng dẫn</button>
      <button class="b2" data-a="wipeslot">🗑️ Xoá save</button>
      <button class="b2" data-a="restart">💥 Chơi lại</button>
    </div>`;
  $('#sheet').classList.remove('hide');
}
function reSheet(){
  if(!T.sheet) return;
  if(T.sheet=='log') openLog();
  else if(T.sheet=='record') openRecord();
  else if(T.sheet=='book') openBook();
}

document.addEventListener('click',e=>{
  const target=e.target.closest('[data-a]');
  if(!target) return;
  const a=target.dataset.a,k=target.dataset.k;
  switch(a){
    case 'do':doAct(k);break;
    case 'next':nextPeriod();break;
    case 'sleep':sleepNow();break;
    case 'latewrite':lateWrite();break;
    case 'accOffer':acceptOffer();break;
    case 'decOffer':declineOffer();break;
    case 'accBig':acceptBig();break;
    case 'decBig':declineBig();break;
    case 'bigEnd':bigEnd();break;
    case 'log':openLog();break;
    case 'book':openBook();break;
    case 'record':openRecord();break;
    case 'home':finishHome();break;
    case 'closeSheet':closeSheet();break;
    case 'mx':mclose();break;
    case 'help':closeSheet();modal(HELP);break;
    case 'saveNote':saveNote();break;
    case 'delNote':delNote(k);break;
    case 'exportNotes':exportNotes();break;
    case 'save':manualSave();reSheet();break;
    case 'load':manualLoad();break;
    case 'export':exportSave();break;
    case 'import':importSave();break;
    case 'snd':S.snd^=1;save();reSheet();break;
    case 'wipeslot':
      if(!hasSlot()) return toast('📭 Chưa có save');
      if(confirm('Xoá save thủ công?')){deleteSlot();toast('🗑️ Đã xoá');reSheet()}
      break;
    case 'restart':
      if(!confirm('Chơi lại từ đầu?')) return;
      localStorage.removeItem(KEY);
      location.reload();
      break;
    case 'note':
      mclose();
      setTimeout(()=>openLog(),200);
      break;
  }
});
const sheetEl=$('#sheet');
if(sheetEl) sheetEl.addEventListener('click',e=>{
  if(e.target.id==='sheet') closeSheet();
});
