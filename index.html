<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#ff5d9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Quán trà sữa của Vân Khánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   QUÁN TRÀ SỮA VÂN KHÁNH — UI 2025
   - Thiết kế "cửa sổ": khung vuông vức, viền rõ, đổ bóng cứng
   - Không animation infinite (tiết kiệm pin/nhiệt)
   - Palette: kem, hồng san hô, vàng mật ong, xanh mint
   ============================================================ */
:root{
  --ink:#231a4a;
  --ink2:#3d3180;
  --mu:#8b86b0;
  --pink:#ff4f9a;
  --pink2:#ffb3d1;
  --coral:#ff7a5c;
  --honey:#ffbe0b;
  --honey2:#ffe27a;
  --mint:#00b884;
  --mint2:#7ee8c2;
  --sky:#5bc0ff;
  --red:#ff4d5e;
  --line:#231a4a;
  --cream:#fff8ef;
  --shadow: 2px 2px 0 var(--line);
  --shadow-lg: 3px 3px 0 var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font:600 14px/1.35 "Be Vietnam Pro","Baloo 2",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(circle at 20% 10%,#ffe7c2 0 2px,transparent 3px) 0 0/28px 28px,
  linear-gradient(180deg,#eaf4ff 0%,#f6ecff 100%);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11.5px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto;
  grid-template-columns:minmax(0,1fr);
  gap:6px;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
}

/* ================= HUD ================= */
#hd{
  position:relative;color:#fff;
  border:2px solid var(--line);border-radius:6px;
  padding:18px 10px 8px;
  background:
    linear-gradient(180deg,#ff7eb3 0%,#ff4f9a 45%,#ff5f7c 100%);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
#hd::before{
  content:"";position:absolute;top:0;left:0;right:0;height:14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);
  border-bottom:1px solid rgba(255,255,255,.4);
}
#pause{
  position:absolute;right:6px;top:16px;width:28px;height:28px;
  border:2px solid var(--line);border-radius:4px;
  background:rgba(255,255,255,.3);
  font-size:13px;line-height:1;z-index:3;color:#fff;
}
#hd .t{
  text-align:center;font-size:15px;font-weight:800;
  padding:0 34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 0 rgba(0,0,0,.15);
  position:relative;z-index:1;
}
#hd .r{display:flex;align-items:center;gap:5px;margin-top:5px;white-space:nowrap;position:relative;z-index:1}

.lvb{
  flex:none;position:relative;width:36px;height:36px;border-radius:4px;
  display:grid;place-items:center;padding-top:5px;
  color:#6b3500;font-size:15px;font-weight:800;
  background:linear-gradient(180deg,#fff3a8,var(--honey));
  border:2px solid var(--line);
  box-shadow:1px 1px 0 var(--line);
}
.lvb::before{content:"LV";position:absolute;top:2px;font-size:8px;font-weight:800;opacity:.8}

.xpw{flex:1;min-width:0;position:relative}
.pb{height:8px;border:2px solid var(--line);border-radius:2px;background:#fff;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--honey2),var(--honey));transition:width .3s}
.xpb{height:14px}
.xpb i{background:
  repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px),
  linear-gradient(90deg,var(--honey2),var(--honey))}
#xpt{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:9px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.5);color:#fff;
}
.chap{
  flex:none;
  background:rgba(35,26,74,.4);border:1px solid rgba(255,255,255,.55);
  border-radius:3px;padding:3px 8px;font-size:11px;font-weight:800;
}
.cur{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;
  background:rgba(35,26,74,.35);border:1px solid rgba(255,255,255,.5);
  border-radius:3px;padding:3px 5px;font-size:12px;
}
.cur b{font-weight:800}
.dpb{margin-top:6px;height:5px}.dpb i{background:linear-gradient(90deg,#fff4c8,#fff)}

/* ================= QUÁN ================= */
.ch1{--w1:#ffe7a3;--w2:#ffcf5c;--dc:#6b3000;--bg:#fff8e6}
.ch2{--w1:#ffb0a0;--w2:#ff7a5c;--dc:#5e0a00;--bg:#fff1ec}
.ch3{--w1:#d4bcff;--w2:#a77bff;--dc:#2a0f66;--bg:#f5efff}

#shop{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  border:2px solid var(--line);border-radius:6px;
  background:
    linear-gradient(180deg,var(--w1),var(--w2)) top/100% 32px no-repeat,
    var(--bg);
  box-shadow:var(--shadow-lg);
}
#shop::before{
  content:"";position:absolute;inset:0;
  background:#1d2350;opacity:var(--n,0);pointer-events:none;z-index:5;
  transition:opacity .8s;
}
#shop .wx{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 1s}
/* Thời tiết: chỉ đổi màu nền, không animate */
.rain .wx{opacity:1;background:linear-gradient(180deg,rgba(40,60,130,.18),rgba(40,60,130,.08))}
.storm .wx{opacity:1;background:linear-gradient(180deg,rgba(20,30,80,.35),rgba(20,30,80,.15))}
.snow .wx{opacity:1;background:linear-gradient(180deg,rgba(200,220,255,.3),rgba(220,235,255,.15))}

#deco{
  height:32px;line-height:30px;text-align:center;
  font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;
  color:var(--dc);
  border-bottom:2px solid var(--line);
  background:rgba(255,255,255,.4);
  position:relative;z-index:2;
}
#tables{
  flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr 1fr;
  gap:6px;padding:8px 8px 0;
}
.tb{
  position:relative;min-height:0;
  border:1px solid rgba(35,26,74,.15);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:6px;
  background:rgba(255,255,255,.35);
  transition:background .2s;
}
.tb::after{
  content:"";position:absolute;bottom:8px;left:15%;right:15%;height:24%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#c58a4e,#8a5320 75%);
  border:2px solid var(--line);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3);
  z-index:1;
}
.tb.sel{
  background:rgba(255,255,255,.75);
  outline:2px solid var(--pink);outline-offset:-2px;
  box-shadow:0 0 0 2px #fff, 0 4px 12px rgba(255,79,154,.35);
}
.tb.lk{
  justify-content:center;gap:2px;
  background:rgba(35,26,74,.08);
  border:2px dashed rgba(35,26,74,.3);
  color:var(--mu);font-size:18px;font-weight:800;
}
.tb.lk span{font-size:10px;display:block;text-align:center;padding:0 4px}
.tb.lk::after{display:none}

.ce{
  position:relative;font-size:clamp(30px,5.2vh,52px);line-height:1;
  margin-bottom:14%;z-index:2;
  filter:drop-shadow(0 3px 1px rgba(0,0,0,.15));
  transition:transform .25s ease-out;
}
.tb.sel .ce{transform:translateY(-4px)}

.cn{
  position:absolute;bottom:10px;z-index:3;
  font-size:11px;font-weight:800;color:#fff;
  background:var(--ink);
  padding:1px 9px;border-radius:10px;border:2px solid #fff;
  white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.emp{
  z-index:2;margin-bottom:24%;
  font-size:11px;color:#8a5a2c;font-weight:800;text-align:center;
  opacity:.7;
}
.bub{
  position:absolute;top:2px;left:4px;z-index:4;
  background:#fff;border:2px solid var(--line);border-radius:8px;
  padding:1px 7px;font-size:clamp(14px,2vh,17px);
  box-shadow:1px 1px 0 var(--line);
}
.bub::after{
  content:"";position:absolute;left:12px;bottom:-7px;
  border:6px solid transparent;border-top-color:var(--line);border-bottom:0;
}
.bub .dn{opacity:.28}
.cd{
  position:absolute;top:2px;right:4px;z-index:4;
  width:clamp(30px,4.4vh,40px);aspect-ratio:1;border-radius:50%;
  border:2px solid var(--line);
  display:grid;place-items:center;
  font-weight:800;font-size:clamp(11px,1.8vh,14px);
  background:conic-gradient(var(--cc,#00b884) calc(var(--p,1)*360deg),#fff 0);
  color:var(--ink);
  box-shadow:1px 1px 0 var(--line);
}
.hurry .cd{background:conic-gradient(var(--red) calc(var(--p,1)*360deg),#fff 0)}

#staffs{
  display:flex;gap:5px;padding:6px 8px 7px;
  overflow-x:auto;scrollbar-width:none;
  border-top:1px solid rgba(35,26,74,.12);
  background:rgba(255,255,255,.25);
}
#staffs::-webkit-scrollbar{display:none}
.sf{
  flex:none;
  border:2px solid var(--line);border-radius:4px;
  padding:2px 9px;font-size:11.5px;font-weight:800;
  white-space:nowrap;background:#fff;
  box-shadow:1px 1px 0 var(--line);
}
.sf.rd{background:var(--honey);box-shadow:1px 1px 0 var(--line),0 0 0 2px rgba(255,190,11,.4)}
.sf small{color:var(--mu);margin-left:3px;font-weight:600}
.sf.rd small{color:#7a4300}

.pop{
  position:absolute;z-index:6;transform:translate(-50%,-50%);
  font-weight:800;font-size:13px;
  background:#fff;border:2px solid var(--line);border-radius:8px;
  padding:0 8px;white-space:nowrap;
  box-shadow:1px 1px 0 var(--line);
  animation:up 1.3s ease-out forwards;
  pointer-events:none;
}
.pop.g{color:#0b8a5f}.pop.b{color:var(--red)}
@keyframes up{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}
}

/* ================= ĐƠN ================= */
#ord{
  white-space:nowrap;overflow:hidden;
  border:2px solid var(--line);border-radius:5px;
  background:#fff;
  border-left:6px solid var(--pink);
  box-shadow:var(--shadow);
  padding:5px 12px;
  font-size:12.5px;min-height:38px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.chp{
  background:#fff5c9;border:2px solid #ffd76a;border-radius:3px;
  padding:0 6px;font-weight:800;
}
.chp.ok{background:#d7fbe9;border-color:var(--mint);color:#0b8a5f}

/* ================= QUẦY PHA ================= */
#bar{
  background:#fff;border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow-lg);
  padding:9px;
  display:grid;grid-template-columns:30% minmax(0,1fr);gap:8px;
}
.cupcol{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(35,26,74,.15);border-radius:4px;
  background:
    radial-gradient(circle at 50% 60%,#e8f4ff 0%,#f5eeff 70%);
}
.cupw{position:relative;width:100%;display:flex;justify-content:center;padding-top:22px}
#cup{
  position:relative;width:82%;max-width:88px;
  height:clamp(105px,17vh,160px);
  border:3px solid #8fbfdc;border-top:0;
  border-radius:0 0 22px 22px;
  overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(225,243,255,.8));
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.05);
}
#cup::after{
  content:"";position:absolute;left:10%;top:6%;bottom:12%;width:11%;
  border-radius:6px;background:rgba(255,255,255,.7);z-index:2;
}
.liq{
  position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);
  background:var(--c,#fff);
  transition:height .5s,background .6s;
}
.liq::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:rgba(255,255,255,.4);
}
.tps{
  position:absolute;left:0;right:0;bottom:3px;text-align:center;
  font-size:clamp(12px,2vh,17px);letter-spacing:-4px;line-height:1.1;
}
.tps span{display:block}
.ices{
  position:absolute;left:0;right:0;top:4px;text-align:center;
  font-size:13px;letter-spacing:-3px;
}
.stream{
  position:absolute;top:0;left:50%;width:8px;margin-left:-4px;height:0;
  border-radius:4px;background:var(--sc);z-index:2;
}
.pour .stream{height:40%;top:35%;opacity:.85;transition:height .3s,opacity .3s}
.lid,.straw{position:absolute;opacity:0;transition:.35s;z-index:3}
.lid{
  top:13px;width:90%;max-width:96px;height:13px;border-radius:8px;
  background:linear-gradient(180deg,#fff,#e0f1ff);
  border:3px solid #8fbfdc;
  transform:translateY(-30px);
}
.straw{
  top:0;left:57%;width:8px;height:55%;border-radius:4px;
  background:repeating-linear-gradient(180deg,var(--pink) 0 7px,#ff9cc8 7px 14px);
  transform:translateY(-40px) rotate(10deg);
}
.pk .lid{opacity:1;transform:none}
.pk .straw{opacity:1;transform:rotate(10deg)}
.shake #cup{box-shadow:inset 0 0 0 3px var(--pink),0 0 12px rgba(255,79,154,.4)}
#sugl{font-size:10.5px;color:var(--mu);font-weight:800;margin-top:3px;text-align:center}
.pbar{width:82%;height:6px;border:2px solid var(--line);border-radius:2px;background:#fff;overflow:hidden;margin:3px 0 6px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--coral));transition:width .2s}

#tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tops{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tn{max-width:94%;overflow:hidden;text-overflow:ellipsis}
.tops .tn{font-size:10px;max-width:100%}
.tops .tile{height:clamp(38px,5vh,50px)}
.tops .tile b{font-size:clamp(17px,2.5vh,23px)}
.tile{
  position:relative;border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:11.5px;
  height:clamp(46px,6.4vh,62px);line-height:1;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f4f6ff);
  border:2px solid var(--line);
  box-shadow:var(--shadow);
}
.tile b{font-size:clamp(20px,3vh,28px);line-height:1.15}
.tile small{position:absolute;top:3px;right:6px;font-size:9.5px;color:var(--mu)}
.tile.big{height:clamp(54px,7.4vh,74px);font-size:14px;background:linear-gradient(180deg,#fffaf0,#ffefc9)}
.tile.need{
  background:linear-gradient(180deg,#fffbe6,#fff0b0);
  box-shadow:var(--shadow),0 0 0 2px var(--honey);
}
.tile.in{
  background:linear-gradient(180deg,var(--mint2),var(--mint));
  border-color:var(--line);color:#fff;
}
.tile.bad{
  background:linear-gradient(180deg,#ffd6df,#ffafc2);
  border-color:var(--line);color:#a3173f;
}
.tile.in small,.tile.bad small{color:inherit;opacity:.9}
.tile.in::after,.tile.bad::after{
  position:absolute;top:-7px;left:-5px;width:20px;height:20px;
  border-radius:50%;display:grid;place-items:center;font-size:12px;
  border:2px solid var(--line);background:#fff;
  box-shadow:1px 1px 0 var(--line);
}
.tile.in::after{content:"✓";color:var(--mint)}
.tile.bad::after{content:"!";background:var(--red);color:#fff}
.tile.lk{opacity:.5;filter:grayscale(.7)}
.tile:active{transform:translate(2px,2px);box-shadow:none}

.acts{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,2fr);gap:7px}
.btn{
  position:relative;border-radius:5px;
  height:clamp(46px,6vh,56px);font-weight:800;font-size:15px;
  background:linear-gradient(180deg,#fff,#eef1fb);
  border:2px solid var(--line);
  box-shadow:var(--shadow);
  display:grid;place-items:center;
}
.btn.p{background:linear-gradient(180deg,#ff86bd,var(--pink));color:#fff}
.btn.y{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#6b3d00}
.btn.go{box-shadow:var(--shadow),0 0 0 2px var(--red)}
.btn:disabled{filter:grayscale(.8);opacity:.5}
.btn:active{transform:translate(2px,2px);box-shadow:none}

/* ================= NAV ================= */
#nav{
  display:grid;grid-template-columns:repeat(5,1fr);
  border:2px solid var(--line);border-radius:5px;
  background:#fff;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
#nav button{
  position:relative;
  font-size:10.5px;font-weight:800;
  padding:6px 0;
  display:flex;flex-direction:column;align-items:center;
  color:var(--mu);
  border-right:2px solid var(--line);
}
#nav button:last-child{border-right:0}
#nav b{font-size:19px;line-height:1.15}
#nav .on{background:linear-gradient(180deg,var(--ink2),var(--ink));color:#fff}
#nav i{
  position:absolute;top:4px;right:10px;
  width:9px;height:9px;border-radius:50%;
  background:var(--red);border:2px solid #fff;
}

/* ================= SHEET / MODAL ================= */
#sheet{
  position:fixed;inset:0;z-index:50;
  background:rgba(35,26,74,.5);
  display:flex;align-items:flex-end;justify-content:center;
}
.shx{
  width:100%;max-width:480px;max-height:78vh;overflow:auto;
  border:2px solid var(--line);border-bottom:0;
  border-radius:8px 8px 0 0;
  padding:12px 14px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg,#fff,#faf7ff);
  box-shadow:0 -4px 0 rgba(35,26,74,.2);
  animation:sup .25s ease-out;
}
@keyframes sup{from{transform:translateY(100%)}}
.shh{
  display:flex;align-items:center;font-size:18px;font-weight:800;
  margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--line);
}
.shh b{flex:1}
h3{margin:14px 0 0;font-size:15px;border-left:4px solid var(--pink);padding-left:7px}
.it{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px dashed #e0d9f0;
}
.it:last-child{border:0}
.it .e{
  flex:none;width:42px;height:42px;border-radius:6px;
  background:linear-gradient(180deg,#fff,#f1ecff);
  border:2px solid var(--line);
  display:grid;place-items:center;font-size:24px;
}
.it .m{flex:1;min-width:0}
.it small{display:block;color:var(--mu);font-weight:600;margin-top:1px}
.it .pb{background:#f0ecfa;margin-top:4px}
.bs{display:flex;gap:5px;flex-wrap:wrap}
.b2{
  border:2px solid var(--line);border-radius:4px;
  padding:5px 10px;font-weight:800;font-size:12.5px;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#eef1fb);
  box-shadow:var(--shadow);
}
.b2.p{background:linear-gradient(180deg,#ff86bd,var(--pink));color:#fff}
.b2.g{background:linear-gradient(180deg,var(--mint2),var(--mint));color:#fff}
.b2:active{transform:translate(2px,2px);box-shadow:none}
.b2:disabled{opacity:.45}

#modal{
  position:fixed;inset:0;z-index:60;
  background:rgba(35,26,74,.55);
  display:grid;place-items:center;padding:16px;
}
.bx{
  width:100%;max-width:400px;max-height:88vh;overflow:auto;
  border:2px solid var(--line);border-radius:8px;
  padding:18px;
  background:linear-gradient(180deg,#fff,#faf7ff);

const tile=(a,k,e,n,cls,s)=>`<button class="tile ${cls}" data-a="${a}" data-k="${k}"><b>${e}</b><span class="tn">${n}</span>${s!=null?`<small>${s}</small>`:''}</button>`;

function drawBar(){

const drawAll=()=>{drawHead();drawTables();drawStaff();drawOrd();drawBar();T.nav='';drawNav()};

/* ---------- KHÁCH ---------- */
function mkDrink(b){
  const e=EV(),w=WX[S.cw];
  return {
    top:Math.random()<.8?P(S.tops):null,
    sugar:b.k=='sweet'?P([3,4]):(e.sug!=null&&Math.random()<.5?e.sug:P([0,1,2,2,3])),
    ice:w.ice!=null&&Math.random()<.5?w.ice:P([0,1,2,2,3]),
    done:0,ip:0
  };
}
function nextSpawn(){
  const mul=WDM[wd()]*WX[S.cw].m*(EV().sp||1)*(rush()?1.25:1)*(.9+S.rep*.004);
  T.sp=R(12,16)/mul;
}
function spawn(){
  if(S.ph!='open'||S.t>=LAST) return 0;
  const free=[...Array(S.up.tb).keys()].filter(i=>!T.cu.some(c=>c.tb==i));
  const pool=CUS.filter(c=>c.lv<=S.lv&&!T.cu.some(x=>x.n==c.n));
  if(!free.length||!pool.length) return 0;
  const pr=pool.find(c=>c.k=='pair');
  const b=pr&&wd()>=5&&Math.random()<.35?pr:P(pool);
  const n=b.k=='pair'?2:b.k=='take'?2+(Math.random()<.4):1;
  const pm=PAT+2*S.up.dc+({calm:10,vip:-5,pair:10,take:18}[b.k]||0);
  const c={...b,id:++T.id,tb:P(free),pm,p:pm,d:Array.from({length:n},()=>mkDrink(b)),in:1};
  T.cu.push(c);beep(880,.15);
  if(!C(T.sel)&&!T.st){T.sel=c.id;drawOrd();drawBar();setTimeout(autoFill,400)}
  drawTables();return 1;
}
function select(id){
  if(!C(id)) return;
  T.sel=id;beep(500,.05);drawTables();drawOrd();drawBar();autoFill();
}
function leave(c,ty){
  c.gone=ty;
  if(T.sel==c.id){
    T.sel=0;
    if(!T.st){
      const n=T.cu.find(x=>cur(x));
      if(n){select(n.id);return later(c,ty)}
    }
    drawOrd();drawBar();
  }
  drawTables();later(c,ty);
}
const later=(c,ty)=>setTimeout(()=>{T.cu=T.cu.filter(x=>x!==c);drawTables()},ty=='ran'?450:700);
function angry(c){
  S.rep=cl(S.rep-(c.k=='vip'?5:3),0,100);S.ds.left++;
  pop(c,'😠 Bỏ về!','b');beep(200,.25);leave(c,'angry');
}

/* ---------- PHA CHẾ ---------- */
function autoFill(){
  const d=cur(C(T.sel)),K=T.K;
  if(!d||T.st||K.tea||K.milk||K.tops.length) return;
  let t=0;
  const go=k=>setTimeout(()=>{if(!T.st&&T.K===K)addIng(k,1)},t+=300);
  if(S.staff.diep){go('tea');go('milk')}
  if(S.staff.dau&&d.top&&S.tops.includes(d.top)) go(d.top);
}
function addIng(k,auto){
  if(T.st) return toast('Đang pha, chờ chút nhé');
  const K=T.K,w=$('#cupw');
  if(TOP[k]){
    const i=K.tops.indexOf(k);
    if(i>=0){if(auto)return;K.tops.splice(i,1)}
    else{
      if(K.tops.length>=2) return toast('Tối đa 2 topping mỗi ly');
      if(inv(k)<1) return toast(`Hết ${nm(k)}, vào Kho nhập thêm`);
      K.tops.push(k);T.last=k;
    }
  } else {
    if(K[k]) return auto||toast(`Ly đã có ${nm(k)} rồi`);
    if(inv(k)<1) return toast(`Hết ${nm(k)}, vào Kho nhập thêm`);
    K[k]=1;
    w.style.setProperty('--sc',k=='tea'?'#b5652b':'#f3ead8');
    w.classList.remove('pour');void w.offsetWidth;w.classList.add('pour');
  }
  beep(k=='tea'?520:k=='milk'?620:760,.08);
  drawBar();drawOrd();
}
function rate(K,d,c){
  let s=5;const n=[];
  if(K.sug!=d.sugar){s--;n.push('sai độ ngọt')}
  if(K.ice!=d.ice){s--;n.push('sai lượng đá')}
  if(d.top&&!K.tops.includes(d.top)){s-=2;n.push('thiếu topping')}
  if(K.tops.some(t=>t!=d.top)){s--;n.push('thừa topping')}
  if(c.p/c.pm<.25){s--;n.push('chờ lâu')}
  if(c.k=='vip'&&n.length){s--;n.push('ông Đại khó tính')}
  return [cl(s,1,5),n];
}
function brew(){
  const c=C(T.sel),d=cur(c),K=T.K;
  if(T.st||!d) return;
  if(!K.tea||!K.milk) return toast('Ly cần có cả 🍃 trà và 🥛 sữa');
  const u=['tea','milk',...K.tops];
  for(const k of u) if(inv(k)<1) return toast(`Hết ${nm(k)}!`);
  u.forEach(use);
  if(S.staff.pheu&&Math.random()<.1+.05*S.staff.pheu){
    const k=P(u);add(k,1);toast(`📦 Phều tiết kiệm được 1 ${nm(k)}`);
  }
  [d.s,d.n]=rate(K,d,c);d.ip=1;T.for={c:c.id,d};
  T.st=1;T.tm=T.tmax=BR[S.up.br];
  $('#cupw').classList.add('shake');
  beep(330,.3);drawBar();drawOrd();
}
function pack(){
  if(T.st!=2) return;
  if(inv('cup')<1) return toast('Hết 🥤 ly + nắp, vào Kho nhập thêm');
  use('cup');T.st=3;T.tm=T.tmax=PK[S.up.pk]/(S.staff.hoa?2:1);
  $('#cupw').classList.add('pk');beep(440,.15);drawBar();
}
function nextCup(){
  const prev=T.for&&T.for.c;newCup();
  const c=cur(C(T.sel))?C(T.sel):cur(C(prev))?C(prev):T.cu.filter(x=>cur(x)).sort((a,b)=>a.p-b.p)[0];
  T.sel=c?c.id:0;
  drawTables();drawBar();drawOrd();autoFill();
}
function deliver(){
  const f=T.for,c=C(f.c);
  if(!c){toast('Khách đã đi mất, ly trà bị bỏ phí 😢');return nextCup()}
  T.st=4;
  const a=$('#cup').getBoundingClientRect(),b=$('#tb'+c.tb).getBoundingClientRect();
  const fl=document.createElement('div');
  fl.className='fly';fl.textContent='🧋';
  fl.style.left=a.left+a.width/2+'px';fl.style.top=a.top+'px';
  document.body.append(fl);fl.getBoundingClientRect();
  fl.style.left=b.left+b.width/2+'px';fl.style.top=b.top+b.height/2+'px';
  fl.style.fontSize='20px';
  setTimeout(()=>{
    fl.remove();
    if(c.gone){toast('Khách đã đi mất 😢');return nextCup()}
    const s=f.d.s;f.d.ip=0;f.d.done=1;
    S.ds.sold++;S.st.sold++;S.ds.rs+=s;S.ds.rc++;S.st.rs+=s;S.st.rc++;
    if(s==5) S.ds.five++;
    pop(c,'★'.repeat(s)+'☆'.repeat(5-s),s>=4?'g':'b');
    if(s<5&&f.d.n.length) toast(`${s}★: ${f.d.n.join(', ')}`);
    if(c.d.every(d=>d.done)) setTimeout(()=>pay(c),500);
    nextCup();
  },520);
}
function pay(c){
  const n=c.d.length,avg=c.d.reduce((a,d)=>a+d.s,0)/n,va=S.staff.vananh||0,e=EV();
  const base=c.d.reduce((a,d)=>a+25+(d.top?TOP[d.top].p:0),0)*SELL[S.ch];
  let amt=Math.round(base*(1+.05*va)*({vip:2,pair:1.15,take:1.3}[c.k]||1)*(.8+.04*avg)),tip=0,o='ok';
  let run=.04,sh=.07;
  if(c.k=='cheat'){run*=2.5;sh*=2}
  if(avg<=2){run*=1.5;sh*=1.5}
  run*=1-.1*va;sh*=1-.1*va;
  if(c.k=='vip') run=sh=0;
  const r=Math.random();
  if(r<run){o='ran';amt=0;S.ds.ran++}
  else if(r<run+sh){o='short';amt=Math.round(amt*R(.5,.8));S.ds.short++}
  else if(Math.random()<(avg>=5?.35:avg>=4?.15:.03)*(c.k=='tip'?2:1)*(e.tip||1)+.04*S.up.dc) tip=Math.round(amt*R(.15,.35));
  S.money+=amt+tip;S.ds.rev+=amt+tip;S.st.rev+=amt+tip;S.ds.tips+=tip;
  S.rep=cl(S.rep+(avg-3)*.4+(e.rv&&avg>=5?1:0),0,100);
  if(c.k=='vip') S.ds.vip++;
  pop(c,o=='ran'?'🏃 Trốn tiền!':o=='short'?`😶 Trả thiếu +${F(amt)}💰`:`+${F(amt)}💰${tip?' 💖+'+F(tip):''}`,o=='ok'?'g':'b');
  beep(o=='ok'?990:200,.2);
  gain(Math.round((8*n*(c.k=='vip'?2:1)+(avg>=5?4:0))*(1+.5*(S.ch-1))));
  leave(c,o=='ran'?'ran':'ok');save();
}
function skill(k){
  if(S.ph!='open') return toast('Chỉ dùng khi quán đang mở cửa');
  if(T.cd[k]>0) return toast(`Còn ${Math.ceil(T.cd[k])}s nữa mới dùng lại được`);
  const l=S.staff[k],s=STF.find(x=>x.k==k);
  if(k=='linh'){
    let n=0;for(let i=0;i<1+(l>>1);i++)n+=spawn();
    if(!n) return toast('Hết bàn trống rồi!');
    toast(`📣 Linh gọi được ${n} khách!`);
  }
  if(k=='hoan'){
    const cs=T.cu.filter(c=>!c.gone);
    if(!cs.length) return toast('Chưa có khách nào');
    cs.forEach(c=>{c.p=Math.min(c.pm,c.p+8+2*l);pop(c,`🍿 +${8+2*l}s`,'g')});
    toast('🍿 Hoàn mời cả quán ăn bim bim!');
  }
  T.cd[k]=s.cd;S.ds.skill++;beep(990,.2);
}

/* ---------- LEVEL / CHƯƠNG / NGÀY ---------- */
function gain(x){
  S.exp+=x;
  while(S.lv<MAXLV&&S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++;lvUp()}
}
function lvUp(){
  const m=(LORE[S.lv]?[`<div class="ev">${LORE[S.lv]}</div>`]:[]).concat(
    STF.filter(s=>s.lv==S.lv).map(s=>`${s.e} Có thể mời <b>${s.n}</b> vào làm (${s.r})`),
    Object.values(TOP).filter(o=>o.lv==S.lv&&o.u).map(o=>`${o.e} Có thể mở topping <b>${o.n}</b>`)
  );
  if(S.lv==2) m.push('👨‍👧 Sông & Biển và 🧑‍✈️ Ý bắt đầu ghé quán');
  if(S.lv==3) m.push('👴 Ông Đại (khách VIP) xuất hiện');
  beep(1200,.4);
  modal(`<h2>⭐ Lên Level ${S.lv}!</h2>${m.map(x=>`<div>${x}</div>`).join('')}<div class="mb"><button class="btn p" data-a="mx">Tuyệt!</button></div>`);
}
function mkMis(){
  const t=Math.min(2,(S.lv-1)/8|0);
  return MS.filter(m=>(m[3]||1)<=S.lv).sort(()=>Math.random()-.5).slice(0,3)
    .map(m=>{
      const n=Math.round(m[2][t]*(m[0]=='rev'?SELL[S.ch]:1));
      return {k:m[0],n,t:m[1].replace('{n}',F(n)),r:Math.round((80+40*t)*SELL[S.ch]),x:30+15*t,c:0};
    });
}
function setupDay(){

}

}

const nch=()=>S.ch==1&&S.lv>=10?2:S.ch==2&&S.lv>=20?3:S.ch;
const est=()=>Math.round(18*WDM[S.day%7]*WX[S.fc].m);
const sugQ=k=>{const e=est();return cl((ING[k]?e:Math.ceil(e*.85/S.tops.length)+2)-invT(k),0,room(k))};
function restockModal(){
  if(!S.fc){S.fc=P(CITY[nch()].wx);save()}
  const w=WX[S.fc],tw=S.day%7,tot=stock().reduce((a,k)=>a+sugQ(k)*uc(k),0);
  modal(`<h2>🌙 Nhập hàng cho ngày mai</h2>
  <div class="ev"><b>Dự báo: ${WD[tw]} · ${w.e} ${w.n}</b>
  <div class="sm">Dự kiến khoảng ${est()} ly${tw>=5?' · cuối tuần đông khách':''}${w.m<1?' · trời xấu, ít khách':''}</div></div>
  <div class="sm">Còn dùng được ngày mai: ${stock().map(k=>{
    const t=invT(k),x=inv(k)-t;
    return OB(k).e+t+(x?`<span style="color:var(--red)"> (−${x} hỏng)</span>`:'');
  }).join(' · ')}</div>
  <div class="mb">
    <button class="btn y" data-a="rsug" ${tot?'':'disabled'}>🛒 Nhập theo gợi ý (${F(tot)}💰)</button>
    <button class="btn" data-a="nav" data-k="kho">📦 Nhập lẻ trong kho</button>
    <button class="btn p" data-a="next">😴 Đi ngủ, sang ngày mới</button>
  </div>`);
}
function buySug(){
  const tot=stock().reduce((a,k)=>a+sugQ(k)*uc(k),0);
  if(S.money<tot) return toast(`Cần ${F(tot)}💰, hãy nhập lẻ trong 📦 Kho`);
  stock().forEach(k=>{const n=sugQ(k);if(n)add(k,n)});
  S.money-=tot;S.nc=(S.nc||0)+tot;beep(990);save();
  drawBar();mclose();restockModal();
}
function nextDay(){
  mclose();
  S.day++;S.t=0;S.ph='prep';S.ds=fresh();
  S.ds.cost=S.nc||0;S.nc=0;S.sp=[];
  for(const k in S.inv){
    let x=0;
    S.inv[k]=S.inv[k].filter(b=>b[1]>=S.day||(x+=b[0],0));
    if(x) S.sp.push(OB(k).e+x);
  }
  const nc=nch();
  S.wx=nc!=S.ch?P(CITY[nc].wx):S.fc||P(CITY[S.ch].wx);S.fc=null;
  if(nc!=S.ch){
    S.ch=nc;
    const k=nc==2?'kc':'km';
    S.tops.push(k);add(k,15);
    modal(CHI[nc]+`<div class="mb"><button class="btn p" data-a="mx">Lên đường!</button></div>`);
  }
  setupDay();save();drawAll();prepModal();
}

/* ---------- KHO / NHÂN VIÊN / NÂNG CẤP / NHIỆM VỤ ---------- */
function buy(k,n){
  n=n=='max'?room(k):Math.min(+n,room(k));
  if(n<=0) return toast('Kho đã đầy loại này');
  const c=uc(k)*n;
  if(S.money<c) return toast(`Không đủ tiền (cần ${F(c)}💰)`);
  S.money-=c;add(k,n);
  S.ph=='restock'?S.nc=(S.nc||0)+c:S.ds.cost+=c;
  beep(990);save();reSheet();drawBar();
}
function hire(k){
  const s=STF.find(x=>x.k==k),l=S.staff[k]||0,c=l?150*l:s.c;
  if((!l&&S.lv<s.lv)||l>=5||(l&&!s.up)) return;
  if(S.money<c) return toast(`Cần ${F(c)}💰`);
  S.money-=c;S.staff[k]=l+1;
  beep(1200,.3);
  toast(l?`${s.e} ${s.n} lên Lv${l+1}!`:`${s.e} ${s.n} đã vào làm!`);
  save();drawStaff();reSheet();
}
function upgrade(k){
  const u=UPG.find(x=>x.k==k),l=S.up[k];
  if(l>=u.mx) return;
  const c=u.c(l);
  if(S.money<c) return toast(`Cần ${F(c)}💰`);
  S.money-=c;S.up[k]++;gain(15);
  beep(1200,.3);toast(`${u.e} ${u.n}: ${u.d(S.up[k])}`);
  save();drawTables();reSheet();
}
function unlockTop(k){
  const o=TOP[k];
  if(S.tops.includes(k)||S.lv<o.lv||o.ch>S.ch) return;
  if(S.money<o.u) return toast(`Cần ${F(o.u)}💰`);
  S.money-=o.u;S.tops.push(k);add(k,10);
  beep(1200,.3);toast(`${o.e} Đã mở ${o.n} (tặng 10 phần)!`);
  save();drawBar();reSheet();
}
function claim(i){
  const m=S.dm[i];
  if(!m||m.c||S.ds[m.k]<m.n) return;
  m.c=1;S.money+=m.r;gain(m.x);
  beep(1200,.3);toast(`🎯 +${F(m.r)}💰 +${m.x} EXP`);
  save();reSheet();
}
const SH={
  kho:['📦 Kho nguyên liệu',()=>`<div class="sm mu">${S.ph=='restock'?'🌙 Giá chợ tối':'🚚 Đang giao gấp, giá ×1.5. Nhập buổi tối sau giờ đóng cửa sẽ rẻ hơn'}${EV().pr?' · 🏷️ giảm 25%':''} · chứa ${cap()}/loại</div>`
    +stock().map(k=>{
      const L=life(k),x=S.inv[k].reduce((a,b)=>a+(b[1]<=S.day?b[0]:0),0);
      return `<div class="it"><div class="e">${OB(k).e}</div><div class="m">
        <b>${OB(k).n}</b>
        <small>${inv(k)}/${cap()} · ${uc(k)}💰/phần · ${L>50?'không hỏng':'để được '+L+' ngày'}${x&&L<50?` · <span style="color:var(--red)">${x} hỏng sau hôm nay</span>`:''}</small>
      </div>
      <div class="bs">
        <button class="b2" data-a="buy" data-k="${k}:5">+5</button>
        <button class="b2" data-a="buy" data-k="${k}:10">+10</button>
        <button class="b2 g" data-a="buy" data-k="${k}:max">Đầy</button>
      </div></div>`;
    }).join('')],
  staff:['👥 Nhân viên',()=>STF.map(s=>{
    const l=S.staff[s.k];
    const b=l?(s.up&&l<5?`<button class="b2 ${S.money>=150*l?'p':''}" data-a="hire" data-k="${s.k}">Lv${l+1} · ${150*l}💰</button>`:'<span class="sm mu">✅</span>')
      :S.lv<s.lv?`<span class="sm mu">🔒 Lv${s.lv}</span>`:`<button class="b2 p" data-a="hire" data-k="${s.k}">Mời · ${s.c}💰</button>`;
    return `<div class="it"><div class="e">${s.e}</div><div class="m"><b>${s.n}</b>${l?' · Lv'+l:''}<small>${s.r}</small><small>${s.d(l||1)}</small></div>${b}</div>`;
  }).join('')],
  up:['⬆️ Nâng cấp',()=>UPG.map(u=>{
    const l=S.up[u.k],mx=l>=u.mx,c=mx?0:u.c(l);
    return `<div class="it"><div class="e">${u.e}</div><div class="m"><b>${u.n}</b><small>${u.d(l)}${mx?'':' → '+u.d(l+1)}</small></div>
    ${mx?'<span class="sm mu">Tối đa</span>':`<button class="b2 ${S.money>=c?'p':''}" data-a="up" data-k="${u.k}">${F(c)}💰</button>`}</div>`;
  }).join('')
  +'<h3>🧁 Mở khóa topping</h3>'+Object.keys(TOP).filter(k=>TOP[k].u).map(k=>{
    const o=TOP[k],own=S.tops.includes(k),ok=S.lv>=o.lv&&o.ch<=S.ch;
    return `<div class="it"><div class="e">${o.e}</div><div class="m"><b>${o.n}</b><small>+${o.p}💰/ly · cần Lv${o.lv} · ${CITY[o.ch].n}</small></div>
    ${own?'<span class="sm mu">✅ Đã có</span>':ok?`<button class="b2 p" data-a="utop" data-k="${k}">${F(o.u)}💰</button>`:'<span class="sm mu">🔒</span>'}</div>`;
  }).join('')],
  quest:['🎯 Nhiệm vụ',()=>{
    const g=S.ch*10,q=CHQ[S.ch];
    return `<div class="ev"><b>📖 Chương ${S.ch} · ${q[0]}</b><div class="sm">${q[1]}</div>
    <div class="it" style="padding:0;border:0"><div class="m"><div class="pb"><i style="width:${Math.min(S.lv,g)/g*100}%;background:var(--pink)"></i></div></div><b>Lv ${S.lv}/${g}</b></div></div>
    <h3>Hôm nay</h3>`+S.dm.map((m,i)=>{
      const v=Math.min(S.ds[m.k],m.n),ok=v>=m.n;
      return `<div class="it"><div class="m"><b>${m.t}</b><small>Thưởng ${F(m.r)}💰 · ${m.x} EXP</small><div class="pb"><i style="width:${v/m.n*100}%"></i></div></div>
      ${m.c?'✅':`<button class="b2 ${ok?'p':''}" data-a="claim" data-k="${i}" ${ok?'':'disabled'}>${ok?'Nhận':F(v)+'/'+F(m.n)}</button>`}</div>`;
    }).join('')
    +`<h3>📊 Tổng kết</h3><div class="sm">Đã bán ${F(S.st.sold)} ly · Doanh thu ${F(S.st.rev)}💰 · Đánh giá TB ${S.st.rc?(S.st.rs/S.st.rc).toFixed(2):'–'}★</div>
    <div class="bs" style="margin-top:8px">
      <button class="b2" data-a="snd">🔊 Âm thanh: ${S.snd?'Bật':'Tắt'}</button>
      <button class="b2" data-a="help">❓ Cách chơi</button>
      <button class="b2" data-a="wipe">🗑️ Chơi lại</button>
    </div>`;
  }]
};
function openSheet(k){
  if(!SH[k]){T.sheet='';$('#sheet').classList.add('hide')}
  else{
    T.sheet=k;
    $('#sht').textContent=SH[k][0];
    $('#shb').innerHTML=SH[k][1]();
    $('#sheet').classList.remove('hide');
  }
  drawNav();
}
const reSheet=()=>T.sheet&&openSheet(T.sheet);

/* ---------- NHẬP LIỆU ---------- */
function act(a,k){
  switch(a){
    case 'sel':select(+k);break;
    case 'ing':case 'top':addIng(k);break;
    case 'lock':toast('Mở khóa topping trong ⬆️ Nâng cấp');break;
    case 'sug':case 'ice':
      if(T.st) return;
      T.K[a]=(T.K[a]+1)%(a=='sug'?5:4);
      beep(500,.05);drawBar();drawOrd();break;
    case 'reset':
      if(T.st) return toast('Đang pha, không làm lại được');
      newCup();drawBar();drawOrd();autoFill();break;
    case 'brew':brew();break;
    case 'pack':pack();break;
    case 'skill':skill(k);break;
    case 'sinfo':{const s=STF.find(x=>x.k==k);toast(`${s.e} ${s.n} (${s.r}): ${s.d(S.staff[k])}`)}break;
    case 'nav':if(T.modal&&k=='kho')mclose();openSheet(k);break;
    case 'buy':{const [i,n]=k.split(':');buy(i,n)}break;
    case 'up':upgrade(k);break;
    case 'hire':hire(k);break;
    case 'utop':unlockTop(k);break;
    case 'claim':claim(+k);break;
    case 'open':if(S.ph=='prep')openDay();break;
    case 'report':report();break;
    case 'rs':mclose();S.ph='restock';save();drawOrd();restockModal();break;
    case 'rsm':restockModal();break;
    case 'rsug':buySug();break;
    case 'next':if(S.ph=='restock'){openSheet('');nextDay()}break;
    case 'mx':mclose();break;
    case 'help':openSheet('');modal(HELP);break;
    case 'pause':T.pause^=1;$('#pause').textContent=T.pause?'▶':'⏸';break;
    case 'snd':S.snd^=1;save();reSheet();break;
    case 'wipe':if(confirm('Xóa toàn bộ tiến trình và chơi lại từ đầu?')){localStorage.removeItem(KEY);location.reload()}break;
  }
}
document.addEventListener('click',e=>{
  if(e.target.id=='sheet') return openSheet('');
  const el=e.target.closest('[data-a]');
  if(el) act(el.dataset.a,el.dataset.k);
});

/* ---------- TICK (chỉ logic, 20fps) ---------- */
function tick(dt){
  S.t+=dt;
  const cdKeys=Object.keys(T.cd);
  for(let i=0;i<cdKeys.length;i++){const k=cdKeys[i];T.cd[k]=Math.max(0,T.cd[k]-dt)}
  const w=S.wc;
  if(w&&!w.d&&S.t>=w.t){
    w.d=1;S.cw=w.to;
    const x=WX[S.cw];
    toast(x.fx?`${x.e} ${x.n}! Khách sẽ ít đi`:'⛅ Trời tạnh rồi, khách lại đông dần');
    drawTables();
  }
  if((T.sp-=dt)<=0){if(!quiet())spawn();nextSpawn()}
  for(let i=0,n=T.cu.length;i<n;i++){
    const c=T.cu[i];
    if(c.gone) continue;
    let allDone=true;
    for(let j=0;j<c.d.length;j++){if(!c.d[j].done&&!c.d[j].ip){allDone=false;break}}
    if(allDone) continue;
    c.p-=dt;
    if(c.p<=0) angry(c);
  }
  if((T.st==1||T.st==3)&&(T.tm-=dt)<=0){
    if(T.st==1){T.st=2;$('#cupw').classList.remove('shake');beep(700,.15);drawBar()}
    else deliver();
  }
  if(S.t>=DAY) endDay();
}

/* ---------- UI (4fps) ---------- */
const EL={};
const el=id=>EL[id]||(EL[id]=document.getElementById(id));
const setTxt=(id,v)=>{const e=el(id);if(e&&e.textContent!==v)e.textContent=v};
const setW=(id,v)=>{const e=el(id);const w=v+'%';if(e&&e.style.width!==w)e.style.width=w};

function refreshCdCache(){
  T.cdEls={};
  for(let i=0;i<T.cu.length;i++){const c=T.cu[i];const e=document.getElementById('cd'+c.id);if(e)T.cdEls[c.id]=e}
  T.skEls={};
  for(let i=0;i<STF.length;i++){const s=STF[i];if(s.sk){const e=document.getElementById('sk_'+s.k);if(e)T.skEls[s.k]=e}}
}
function ui(){
  const m=clk();
  setTxt('money',F(S.money));
  setTxt('rep',Math.round(S.rep));
  setTxt('lv',S.lv);
  setTxt('day',`${WDS[wd()]} · Ngày ${S.day}`);
  setTxt('xpt',`${S.exp}/${need(S.lv)}`);
  setTxt('wxi',WX[S.cw].e);
  setTxt('clock',String(m/60|0).padStart(2,'0')+':'+String(m%60|0).padStart(2,'0'));
  const deco=S.ph!='open'?CITY[S.ch].d
    :quiet()?'😴 Phố vắng khách... nghỉ tay chút nào'
    :rush()?'🔥 Giờ cao điểm!':CITY[S.ch].d;
  setTxt('deco',deco);
  const fx=WX[S.cw].fx||'';
  if(fx!=T.fx){T.fx=fx;$('#shop').className=fx}
  setW('xp',S.exp/need(S.lv)*100);
  setW('dp',S.t/DAY*100);
  if(!T.cdEls||T.cdEls._n!==T.cu.length){refreshCdCache();T.cdEls._n=T.cu.length}
  for(let i=0;i<T.cu.length;i++){
    const c=T.cu[i];
    const e=T.cdEls[c.id];
    if(!e||c.gone) continue;
    const f=cl(c.p/c.pm,0,1);
    let allDone=true;
    for(let j=0;j<c.d.length;j++){if(!c.d[j].done&&!c.d[j].ip){allDone=false;break}}
    const txt=allDone?'✓':Math.ceil(c.p);
    if(e.textContent!==txt) e.textContent=txt;
    e.style.setProperty('--p',f);
    e.style.setProperty('--cc',f>.5?'#00b884':f>.25?'#ffbe0b':'#ff4d5e');
    const hurry=f<.25&&!allDone;
    if(e.parentNode._hz!==hurry){e.parentNode._hz=hurry;e.parentNode.classList.toggle('hurry',hurry)}
  }
  if(!T.skEls) refreshCdCache();
  for(let i=0;i<STF.length;i++){
    const s=STF[i];
    const e=T.skEls[s.k];
    if(!e) continue;
    const cd=T.cd[s.k]||0;
    const txt=cd>0?Math.ceil(cd)+'s':'✨';
    if(e.textContent!==txt) e.textContent=txt;
    const rd=cd<=0&&S.ph=='open';
    if(e.parentNode._rd!==rd){e.parentNode._rd=rd;e.parentNode.classList.toggle('rd',rd)}
  }
  const busy=T.st==1||T.st==3;
  const pr=busy?1-T.tm/T.tmax:T.st>=2?1:0;
  if(busy) setTxt(T.st==1?'bBrew':'bPack',(T.st==1?'🫗 Pha ':'📦 Gói ')+Math.round(pr*100)+'%');
  setW('prog',pr*100);
  $('#shop').style.setProperty('--n',Math.max(0,Math.min(.28,(m/60-18)*.1)));
}

/* ---------- VÒNG LẶP ---------- */
let last=performance.now(),acc=0,uiAcc=0,rafId=0;
const LOGIC_HZ=20,UI_HZ=4;
const LOGIC_STEP=1/LOGIC_HZ,UI_STEP=1/UI_HZ;

function loop(now){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(S.ph=='open'&&!T.pause&&!T.modal){
    acc+=dt;let steps=0;
    while(acc>=LOGIC_STEP&&steps++<5){tick(LOGIC_STEP);acc-=LOGIC_STEP}
    if(steps>=5) acc=0;
  } else acc=0;
  uiAcc+=dt;
  if(uiAcc>=UI_STEP){uiAcc=0;ui()}
  if((T.sv+=dt)>3){T.sv=0;save();drawNav()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    if(AC) AC.suspend();
  } else if(!rafId){
    last=performance.now();acc=0;
    if(AC) AC.resume();
    rafId=requestAnimationFrame(loop);
  }
});

/* ---------- KHỞI ĐỘNG ---------- */
newCup();
if(!S.dm.length){S.wx=P(['sun','cloud']);setupDay()}
drawAll();
if(!S.seen){S.seen=1;save();modal(INTRO);modal(HELP)}
if(S.ph=='prep') prepModal();
else if(S.ph=='end') report();
else if(S.ph=='restock') restockModal();
requestAnimationFrame(loop);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
