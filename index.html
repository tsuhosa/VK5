<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#ffb6d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🌸 Quán trà sữa của Vân Khánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3b5c;
  --ink2:#6b5a80;
  --mu:#a89ab8;
  --pink:#ff8fb8;
  --pink2:#ffc6dd;
  --pink3:#ffe4ef;
  --rose:#ff6b9d;
  --lav:#c9b6f0;
  --lav2:#e6dcff;
  --mint:#8ed9c0;
  --mint2:#d4f4e7;
  --peach:#ffb89c;
  --peach2:#ffe0d2;
  --cream:#fff8f3;
  --honey:#ffd98a;
  --line:#4a3b5c;
  --shadow-soft:0 2px 8px rgba(180,140,180,.18);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{
  margin:0;height:100%;overflow:hidden;
  color:var(--ink);
  font:600 13.5px/1.35 "Quicksand",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{
  background:
    radial-gradient(circle at 12% 18%,rgba(255,200,220,.55) 0 4px,transparent 5px),
    radial-gradient(circle at 88% 72%,rgba(200,180,240,.4) 0 3px,transparent 4px),
    radial-gradient(circle at 50% 50%,#fff5f9 0%,#f5ecff 55%,#e8f4ff 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto;
  grid-template-columns:minmax(0,1fr);
  gap:7px;
  padding:calc(env(safe-area-inset-top) + 8px) 9px calc(env(safe-area-inset-bottom) + 8px);
}

/* HUD */
#hd{
  position:relative;color:#fff;
  border-radius:var(--radius);
  padding:16px 11px 9px;
  background:
    radial-gradient(circle at 20% -20%,rgba(255,255,255,.5),transparent 40%),
    linear-gradient(155deg,#ffb3d1 0%,#ff8fb8 40%,#c9b6f0 100%);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.35);
  overflow:hidden;
}
#hd::before{
  content:"";position:absolute;top:0;left:0;right:0;height:11px;
  background:
    radial-gradient(circle,rgba(255,255,255,.7) 0 2px,transparent 3px) 0 0/14px 11px;
  border-bottom:1px solid rgba(255,255,255,.5);
  pointer-events:none;
}
#pause{
  position:absolute;right:7px;top:14px;width:26px;height:26px;
  border-radius:50%;
  background:rgba(255,255,255,.4);
  border:2px solid #fff;
  font-size:12px;line-height:1;z-index:3;color:#fff;
  box-shadow:0 2px 0 rgba(180,140,180,.4);
}
#hd .t{
  text-align:center;font-size:14.5px;font-weight:700;
  padding:0 30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(150,90,130,.35);
  position:relative;z-index:1;
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#hd .r{display:flex;align-items:center;gap:5px;margin-top:5px;white-space:nowrap;position:relative;z-index:1}

.lvb{
  flex:none;position:relative;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;padding-top:4px;
  color:#8a4500;font-size:14px;font-weight:700;
  background:linear-gradient(180deg,#fff3b8,var(--honey));
  border:2px solid #fff;
  box-shadow:0 2px 0 rgba(180,140,180,.4);
}
.lvb::before{content:"LV";position:absolute;top:2px;font-size:7.5px;font-weight:700;opacity:.8}

.xpw{flex:1;min-width:0;position:relative}
.pb{height:8px;border-radius:6px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 2px rgba(180,140,180,.25)}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff3b8,#ffd98a);transition:width .3s}
.xpb{height:13px}
.xpb i{background:
  radial-gradient(circle,rgba(255,255,255,.6) 0 2px,transparent 2.5px) 0 0/8px 8px,
  linear-gradient(90deg,#fff3b8,#ffd98a);
}
#xpt{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:9px;font-weight:700;text-shadow:0 1px 1px rgba(150,90,130,.5);color:#fff;
}
.chap{
  flex:none;
  background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.7);
  border-radius:10px;padding:3px 8px;font-size:10.5px;font-weight:700;
}
.cur{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.65);
  border-radius:10px;padding:3px 5px;font-size:11.5px;
}
.cur b{font-weight:700}
.dpb{margin-top:5px;height:5px}.dpb i{background:linear-gradient(90deg,#fff4c8,#fff)}

/* QUÁN */
.ch1{--w1:#ffe4c9;--w2:#ffc6dd;--dc:#8a4a6a;--bg:#fff5fa}
.ch2{--w1:#ffd0c4;--w2:#ffb89c;--dc:#8a3a2a;--bg:#fff2ec}
.ch3{--w1:#e0d0ff;--w2:#c9b6f0;--dc:#5a4a8a;--bg:#f7f2ff}

#shop{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  border-radius:var(--radius);
  background:
    linear-gradient(180deg,var(--w1),var(--w2)) top/100% 30px no-repeat,
    var(--bg);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.35);
}
#shop::before{
  content:"";position:absolute;inset:0;
  background:#3a2a5c;opacity:var(--n,0);pointer-events:none;z-index:5;
  transition:opacity .8s;
}
#shop .wx{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 1s}
.rain .wx{opacity:1;background:linear-gradient(180deg,rgba(140,170,220,.22),rgba(140,170,220,.05))}
.storm .wx{opacity:1;background:linear-gradient(180deg,rgba(90,110,180,.32),rgba(90,110,180,.1))}
.snow .wx{opacity:1;background:linear-gradient(180deg,rgba(220,235,255,.4),rgba(240,245,255,.15))}

#deco{
  height:30px;line-height:28px;text-align:center;
  font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  color:var(--dc);
  border-bottom:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.4);
  position:relative;z-index:2;
  letter-spacing:.3px;
}
#tables{
  flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr 1fr;
  gap:7px;padding:8px 8px 0;
}
.tb{
  position:relative;min-height:0;
  border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:6px;
  background:
    radial-gradient(circle at 50% 25%,rgba(255,255,255,.7),transparent 60%),
    rgba(255,255,255,.4);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8);
  transition:background .25s;
}
.tb::after{
  content:"";position:absolute;bottom:8px;left:16%;right:16%;height:22%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#e8b98a,#b87840 75%);
  border:2px solid #fff;
  box-shadow:0 2px 4px rgba(120,70,40,.25),inset 0 2px 0 rgba(255,255,255,.4);
  z-index:1;
}
.tb.sel{
  background:
    radial-gradient(circle at 50% 25%,rgba(255,255,255,.9),transparent 60%),
    linear-gradient(180deg,#fff0f6,#ffe4ef);
  box-shadow:inset 0 0 0 2px var(--rose),0 0 0 4px rgba(255,143,184,.25),var(--shadow-soft);
}
.tb.lk{
  justify-content:center;gap:2px;
  background:rgba(200,180,220,.18);
  border:2px dashed rgba(180,140,200,.5);
  color:var(--mu);font-size:17px;font-weight:700;
}
.tb.lk span{font-size:9.5px;display:block;text-align:center;padding:0 4px}
.tb.lk::after{display:none}

.ce{
  position:relative;font-size:clamp(28px,5vh,50px);line-height:1;
  margin-bottom:14%;z-index:2;
  filter:drop-shadow(0 3px 2px rgba(120,80,120,.18));
  transition:transform .3s ease-out;
}
.tb.sel .ce{transform:translateY(-3px)}

.cn{
  position:absolute;bottom:9px;z-index:3;
  font-size:10.5px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,#c9b6f0,#a890e0);
  padding:1px 8px;border-radius:9px;border:1.5px solid #fff;
  white-space:nowrap;
  box-shadow:0 2px 0 rgba(150,110,190,.4);
  font-family:"Comfortaa",sans-serif;
}
.emp{
  z-index:2;margin-bottom:24%;
  font-size:10.5px;color:#a87098;font-weight:700;text-align:center;
  opacity:.75;
}
.bub{
  position:absolute;top:3px;left:5px;z-index:4;
  background:#fff;border:1.5px solid var(--pink2);border-radius:10px;
  padding:1px 7px;font-size:clamp(13px,1.9vh,16px);
  box-shadow:0 2px 4px rgba(180,140,180,.2);
}
.bub::after{
  content:"";position:absolute;left:11px;bottom:-5px;
  border:5px solid transparent;border-top-color:#fff;border-bottom:0;
  filter:drop-shadow(0 1.5px 0 var(--pink2));
}
.bub .dn{opacity:.25}
.cd{
  position:absolute;top:3px;right:5px;z-index:4;
  width:clamp(28px,4.2vh,38px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:clamp(10px,1.7vh,13px);
  background:conic-gradient(var(--cc,#8ed9c0) calc(var(--p,1)*360deg),#fff 0);
  color:var(--ink);
  border:1.5px solid #fff;
  box-shadow:0 2px 4px rgba(180,140,180,.3);
  font-family:"Comfortaa",sans-serif;
}
.hurry .cd{background:conic-gradient(#ff6b9d calc(var(--p,1)*360deg),#fff 0)}

#staffs{
  display:flex;gap:5px;padding:6px 8px 7px;
  overflow-x:auto;scrollbar-width:none;
  background:rgba(255,255,255,.25);
}
#staffs::-webkit-scrollbar{display:none}
.sf{
  flex:none;
  border-radius:10px;
  padding:2px 9px;font-size:11px;font-weight:700;
  white-space:nowrap;background:#fff;
  border:1.5px solid var(--pink2);
  box-shadow:0 2px 4px rgba(180,140,180,.18);
  color:var(--ink);
}
.sf.rd{
  background:linear-gradient(180deg,#ffe4ef,#ffc6dd);
  border-color:var(--rose);
  box-shadow:0 2px 4px rgba(180,140,180,.2),0 0 0 2px rgba(255,143,184,.3);
}
.sf small{color:var(--mu);margin-left:3px;font-weight:600}
.sf.rd small{color:var(--rose)}

.pop{
  position:absolute;z-index:6;transform:translate(-50%,-50%);
  font-weight:700;font-size:12.5px;
  background:#fff;border:1.5px solid var(--pink2);border-radius:10px;
  padding:1px 8px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(180,140,180,.3);
  animation:up 1.3s ease-out forwards;
  pointer-events:none;
  color:var(--ink);
}
.pop.g{color:#4aaa88;border-color:var(--mint)}
.pop.b{color:var(--rose);border-color:var(--rose)}
@keyframes up{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.75)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}
}

/* ĐƠN */
#ord{
  white-space:nowrap;overflow:hidden;
  border-radius:11px;
  background:
    linear-gradient(90deg,var(--pink2) 0 5px,transparent 5px),
    #fff;
  box-shadow:var(--shadow-soft);
  padding:6px 12px 6px 14px;
  font-size:12px;min-height:36px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.chp{
  background:linear-gradient(180deg,#fff8e0,#ffefc0);
  border:1.5px solid #ffd98a;border-radius:8px;
  padding:0 6px;font-weight:700;font-size:11.5px;
}
.chp.ok{background:linear-gradient(180deg,#e0f7ec,#c4eedd);border-color:var(--mint);color:#3a8a70}

/* QUẦY PHA */
#bar{
  background:
    radial-gradient(circle at 20% 0%,rgba(255,220,235,.5),transparent 50%),
    #fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.3);
  padding:9px;
  display:grid;grid-template-columns:30% minmax(0,1fr);gap:8px;
}
.cupcol{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;
  background:
    radial-gradient(circle at 50% 65%,#e8f4ff 0%,#f5eeff 70%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9);
}
.cupw{position:relative;width:100%;display:flex;justify-content:center;padding-top:20px}
#cup{
  position:relative;width:80%;max-width:84px;
  height:clamp(100px,16vh,150px);
  border:2.5px solid #b6d4ea;border-top:0;
  border-radius:0 0 20px 20px;
  overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(225,243,255,.75));
  box-shadow:inset 0 -6px 10px rgba(140,180,220,.12);
}
#cup::after{
  content:"";position:absolute;left:12%;top:6%;bottom:12%;width:10%;
  border-radius:5px;background:rgba(255,255,255,.75);z-index:2;
}
.liq{
  position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);
  background:var(--c,#fff);
  transition:height .5s,background .6s;
}
.liq::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:rgba(255,255,255,.45);
}
.tps{
  position:absolute;left:0;right:0;bottom:3px;text-align:center;
  font-size:clamp(11px,1.9vh,16px);letter-spacing:-4px;line-height:1.1;
}
.tps span{display:block}
.ices{
  position:absolute;left:0;right:0;top:4px;text-align:center;
  font-size:12px;letter-spacing:-3px;
}
.stream{
  position:absolute;top:0;left:50%;width:7px;margin-left:-3.5px;height:0;
  border-radius:4px;background:var(--sc);z-index:2;
}
.pour .stream{height:38%;top:36%;opacity:.9;transition:height .3s,opacity .3s}
.lid,.straw{position:absolute;opacity:0;transition:.35s;z-index:3}
.lid{
  top:12px;width:88%;max-width:92px;height:12px;border-radius:7px;
  background:linear-gradient(180deg,#fff,#e8f4ff);
  border:2.5px solid #b6d4ea;
  transform:translateY(-28px);
}
.straw{
  top:0;left:58%;width:7px;height:55%;border-radius:4px;
  background:repeating-linear-gradient(180deg,var(--rose) 0 6px,#ffc6dd 6px 12px);
  transform:translateY(-38px) rotate(10deg);
}
.pk .lid{opacity:1;transform:none}
.pk .straw{opacity:1;transform:rotate(10deg)}
.shake #cup{box-shadow:inset 0 0 0 2.5px var(--rose),0 0 14px rgba(255,143,184,.4)}
#sugl{font-size:10px;color:var(--mu);font-weight:700;margin-top:2px;text-align:center}

#tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tops{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tn{max-width:94%;overflow:hidden;text-overflow:ellipsis}
.tops .tn{font-size:9.5px;max-width:100%}
.tops .tile{height:clamp(36px,4.8vh,48px)}
.tops .tile b{font-size:clamp(16px,2.4vh,22px)}
.tile{
  position:relative;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:11px;
  height:clamp(44px,6.2vh,60px);line-height:1;white-space:nowrap;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 70%),
    linear-gradient(180deg,#fff,#f5f0ff);
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.9);
  color:var(--ink);
  transition:background .2s,box-shadow .2s;
}
.tile b{font-size:clamp(19px,2.9vh,26px);line-height:1.15}
.tile small{position:absolute;top:3px;right:6px;font-size:9px;color:var(--mu)}
.tile.big{height:clamp(52px,7.2vh,72px);font-size:13px;background:
  radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 70%),
  linear-gradient(180deg,#fffaf0,#ffe9c9)}
.tile.need{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 70%),
    linear-gradient(180deg,#fff5e0,#ffe0b0);
  box-shadow:var(--shadow-soft),0 0 0 2.5px var(--honey);
}
.tile.in{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),
    linear-gradient(180deg,#a8e6d0,#7ecbaf);
  color:#fff;
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.7);
}
.tile.bad{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),
    linear-gradient(180deg,#ffc6dd,#ff9bbf);
  color:#a3173f;
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.7);
}
.tile.in small,.tile.bad small{color:inherit;opacity:.9}
.tile.in::after,.tile.bad::after{
  position:absolute;top:-6px;left:-4px;width:19px;height:19px;
  border-radius:50%;display:grid;place-items:center;font-size:11px;
  border:2px solid #fff;background:#fff;
  box-shadow:0 2px 4px rgba(180,140,180,.3);
}
.tile.in::after{content:"✓";color:var(--mint);font-weight:800}
.tile.bad::after{content:"!";background:var(--rose);color:#fff;font-weight:800}
.tile.lk{opacity:.55;filter:grayscale(.6)}
.tile:active{transform:translateY(2px)}

.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.acts.two{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.btn{
  position:relative;border-radius:12px;
  height:clamp(46px,6vh,56px);font-weight:700;font-size:14.5px;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 70%),
    linear-gradient(180deg,#fff,#f0eaff);
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.9);
  display:grid;place-items:center;
  color:var(--ink);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
.btn.p{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.5),transparent 70%),
    linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;
  text-shadow:0 1px 2px rgba(180,80,120,.3);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(200,100,150,.3);
}
.btn.y{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),
    linear-gradient(180deg,#ffe4a8,#ffd070);
  color:#8a5a00;
}
.btn.go{
  box-shadow:var(--shadow-soft),0 0 0 3px rgba(255,143,184,.4);
}
.btn:disabled{filter:grayscale(.7);opacity:.5}
.btn:active{transform:translateY(2px)}

/* NAV */
#nav{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-radius:var(--radius);
  background:
    radial-gradient(circle at 50% 0%,rgba(255,220,235,.4),transparent 60%),
    #fff;
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.3);
  overflow:hidden;
}
#nav button{
  position:relative;
  font-size:9.5px;font-weight:700;
  padding:7px 0;
  display:flex;flex-direction:column;align-items:center;
  color:var(--mu);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#nav b{font-size:18px;line-height:1.15}
#nav .on{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.3),transparent 70%),
    linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;
}
#nav i{
  position:absolute;top:4px;right:9px;
  width:9px;height:9px;border-radius:50%;
  background:var(--rose);border:2px solid #fff;
  box-shadow:0 1px 2px rgba(180,80,120,.4);
}

/* SHEET / MODAL */
#sheet{
  position:fixed;inset:0;z-index:50;
  background:rgba(74,59,92,.45);

<li>Bấm 🫗 Pha. Khi mua <b>Máy đóng gói tự động</b> trong ⬆️ Nâng cấp, món đúng sẽ tự gói gửi khách.</li>
<li>Coi chừng khách trả thiếu hoặc ôm ly bỏ chạy!</li>
<li>Tối đóng cửa thì nhập hàng cho ngày mai. Sữa và đồ tươi chỉ để được 1–3 ngày. Mua gấp trong ngày đắt hơn ×1.5.</li>

</ol>
<div class="mb"><button class="btn p" data-a="mx">Bắt đầu! 🌸</button></div>`;

const fresh=()=>({sold:0,rev:0,cost:0,five:0,rs:0,rc:0,left:0,ran:0,short:0,tips:0,vip:0,skill:0});

const T={cu:[],sel:0,id:0,K:null,st:0,tm:0,tmax:1,for:null,cd:{},sp:3,pause:0,modal:0,mq:[],sheet:'',last:'',sv:0,nav:'',fx:'',cdEls:null,skEls:null};

function newCup(){
  T.K={tea:0,milk:0,tops:[],sug:0,ice:0};
  T.st=0;T.for=null;
  $('#cupw').classList.remove('pk','shake');
}
const C=id=>T.cu.find(c=>c.id==id&&!c.gone);
const cur=c=>c&&!c.gone&&c.d.find(d=>!d.done&&!d.ip);
const EV=()=>EVS[S.ev][2]||{};
const cap=()=>CAP[S.up.st];
const need=l=>50*l;
const OB=k=>ING[k]||TOP[k];
const nm=k=>OB(k).e+' '+OB(k).n;
const stock=()=>['tea','milk','cup',...S.tops];
const wd=()=>(S.day-1)%7;
const quiet=()=>S.q.some(([a,b])=>S.t>=a&&S.t<b);
const clk=()=>600+Math.min(S.t,DAY)*3;
const rush=()=>{const m=clk();return (m>=690&&m<780)||(m>=1080&&m<1200)};
const inv=k=>S.inv[k].reduce((a,b)=>a+b[0],0);
const invT=k=>S.inv[k].reduce((a,b)=>a+(b[1]>S.day?b[0]:0),0);
const life=k=>OB(k).l;
function add(k,n){const e=S.day+life(k)-(S.ph=='restock'?0:1);const b=S.inv[k].find(x=>x[1]==e);b?b[0]+=n:S.inv[k].push([n,e])}
function use(k){const B=S.inv[k].sort((a,b)=>a[1]-b[1]);if(B[0]&&!--B[0][0])B.shift()}
const room=k=>cap()-(S.ph=='restock'?invT(k):inv(k));
const uc=k=>Math.ceil(OB(k).c*COST[S.ch]*(EV().pr||1)*(S.ph=='restock'?1:1.5));
const autoPack=()=>S.up.pk>=1;

let AC=null;
function beep(f=600,d=.1){
  if(!S.snd) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.045,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

function toast(m){
  const d=document.createElement('div');d.textContent=m;
  $('#toast').append(d);
  setTimeout(()=>d.remove(),2200);
  const q=$('#toast').children;if(q.length>3)q[0].remove();
}
function pop(c,txt,cls=''){
  const el=$('#tb'+c.tb);if(!el)return;
  const s=$('#shop').getBoundingClientRect(),r=el.getBoundingClientRect();
  const p=document.createElement('div');
  p.className='pop '+cls;p.textContent=txt;
  p.style.left=r.left-s.left+r.width/2+'px';
  p.style.top=r.top-s.top+r.height*.45+'px';
  $('#shop').append(p);
  p.addEventListener('animationend',()=>p.remove(),{once:true});
}
function modal(h){

function mclose(){

}

  $('#tables').innerHTML=[0,1,2,3].map(i=>{

  if(S.ph=='restock') return o.innerHTML=`🌙 <button class="b2" data-a="rsm">🛒 Nhập hàng</button><button class="b2 p" data-a="next">😴 Sang ngày mới</button>`;
  const chips=d=>`<span class="chp ${K.sug==d.sugar?'ok':''}">🍬${SUG[d.sugar]}</span><span class="chp ${K.ice==d.ice?'ok':''}">🧊${ICE[d.ice]}</span>`;

const tile=(a,k,e,n,cls,s)=>`<button class="tile ${cls}" data-a="${a}" data-k="${k}"><b>${e}</b><span class="tn">${n}</span>${s!=null?`<small>${s}</small>`:''}</button>`;

function drawBar(){
  const K=T.K,b=T.st>0,D=b?T.for&&T.for.d:cur(C(T.sel));
  const q=(has,want)=>has?(!D||want?'in':'bad'):(D&&want&&!b?'need':'');
  const lv=(v,w)=>!D?(v?'in':''):(v==w?'in':v>w?'bad':(b?'':'need'));
  $('#tiles').innerHTML=
    tile('ing','tea','🍃','Trà','big '+q(K.tea,1),inv('tea'))+
    tile('ing','milk','🥛','Sữa','big '+q(K.milk,1),inv('milk'))+
    tile('sug','','🍬','Đường '+SUG[K.sug],lv(K.sug,D&&D.sugar))+
    tile('ice','','🧊',ICE[K.ice],lv(K.ice,D&&D.ice))+
    `<div class="tops">${Object.keys(TOP).map(k=>{
      const o=TOP[k];
      if(!S.tops.includes(k)) return tile('lock','','🔒',o.ch>S.ch?'Chương '+o.ch:'Lv'+o.lv,'lk');
      return tile('top',k,o.e,o.s||o.n,q(K.tops.includes(k),D&&D.top==k),inv(k));
    }).join('')}</div>`;
  const d=cur(C(T.sel));
  const bBrew=$('#bBrew'),bPack=$('#bPack'),acts=$('#acts');
  bBrew.disabled=T.st!=0||!d;
  bBrew.classList.toggle('go',!T.st&&!!(d&&K.tea&&K.milk));
  bBrew.textContent=T.st==1?'🫗 Đang pha...':T.st>=2?'✨ Xong!':'🫗 Pha';
  if(autoPack()){
    bPack.classList.add('hide');
    acts.classList.add('two');
  } else {
    bPack.classList.remove('hide');
    acts.classList.remove('two');
    bPack.disabled=T.st!=2;
    bPack.classList.toggle('go',T.st==2);
    bPack.textContent=T.st==3?'📦 Đang gói...':'📦 Đóng gói';
  }
  const w=$('#cupw'),full=K.tea&&K.milk;
  w.style.setProperty('--h',(full?80:K.tea||K.milk?45:0)+'%');
  w.style.setProperty('--c',full?'#d9a26f':K.tea?'#b5652b':'#f5efe4');
  $('#tps').innerHTML=K.tops.map(k=>`<span class="${k==T.last?'dr':''}">${TOP[k].e.repeat(4)}</span>`).join('');

  $('#sugl').textContent=`🍬${SUG[K.sug]} · ${ICE[K.ice]}`;
}
function drawNav(){

  if(sig==T.nav) return;

  $('#nav').innerHTML=[['shop','🧋','Quán'],['kho','📦','Kho',lo],['staff','👥','Nhân viên'],['up','⬆️','Nâng cấp'],['quest','🎯','Nhiệm vụ',q]]
    .map(([k,e,n,dot])=>`<button data-a="nav" data-k="${k}" class="${(T.sheet||'shop')==k?'on':''}"><b>${e}</b>${n}${dot?'<i></i>':''}</button>`).join('');
}
const drawAll=()=>{drawHead();drawTables();drawStaff();drawOrd();drawBar();T.nav='';drawNav()};

function mkDrink(b){
  const e=EV(),w=WX[S.cw];
  return {
    top:Math.random()<.8?P(S.tops):null,
    sugar:b.k=='sweet'?P([3,4]):(e.sug!=null&&Math.random()<.5?e.sug:P([0,1,2,2,3])),
    ice:w.ice!=null&&Math.random()<.5?w.ice:P([0,1,2,2,3]),
    done:0,ip:0
  };
}
function nextSpawn(){
  const mul=WDM[wd()]*WX[S.cw].m*(EV().sp||1)*(rush()?1.25:1)*(.9+S.rep*.004);
  T.sp=R(12,16)/mul;
}
function spawn(){
  if(S.ph!='open'||S.t>=LAST) return 0;
  const free=[...Array(S.up.tb).keys()].filter(i=>!T.cu.some(c=>c.tb==i));
  const pool=CUS.filter(c=>c.lv<=S.lv&&!T.cu.some(x=>x.n==c.n));
  if(!free.length||!pool.length) return 0;
  const pr=pool.find(c=>c.k=='pair');
  const b=pr&&wd()>=5&&Math.random()<.35?pr:P(pool);
  const n=b.k=='pair'?2:b.k=='take'?2+(Math.random()<.4):1;
  const pm=PAT+2*S.up.dc+({calm:10,vip:-5,pair:10,take:18}[b.k]||0);
  const c={...b,id:++T.id,tb:P(free),pm,p:pm,d:Array.from({length:n},()=>mkDrink(b)),in:1};
  T.cu.push(c);beep(880,.15);
  if(!C(T.sel)&&!T.st){T.sel=c.id;drawOrd();drawBar();autoFill()}
  drawTables();return 1;
}
function select(id){
  if(!C(id)) return;
  T.sel=id;beep(500,.05);drawTables();drawOrd();drawBar();autoFill();
}
function leave(c,ty){
  c.gone=ty;
  if(T.sel==c.id){
    T.sel=0;
    if(!T.st){
      const n=T.cu.find(x=>cur(x));
      if(n){select(n.id);return later(c,ty)}
    }
    drawOrd();drawBar();
  }
  drawTables();later(c,ty);
}
const later=(c,ty)=>setTimeout(()=>{T.cu=T.cu.filter(x=>x!==c);drawTables()},ty=='ran'?450:700);
function angry(c){
  S.rep=cl(S.rep-(c.k=='vip'?5:3),0,100);S.ds.left++;
  pop(c,'😠 Bỏ về!','b');beep(200,.25);leave(c,'angry');
}

function autoFill(){
  const d=cur(C(T.sel)),K=T.K;
  if(!d||T.st||K.tea||K.milk||K.tops.length) return;
  let t=0;
  const go=k=>setTimeout(()=>{if(!T.st&&T.K===K)addIng(k,1)},t+=300);
  if(S.staff.diep){go('tea');go('milk')}
  if(S.staff.dau&&d.top&&S.tops.includes(d.top)) go(d.top);
}
function addIng(k,auto){
  if(T.st) return toast('Đang pha, chờ chút nhé');
  const K=T.K,w=$('#cupw');
  if(TOP[k]){
    const i=K.tops.indexOf(k);
    if(i>=0){if(auto)return;K.tops.splice(i,1)}
    else{
      if(K.tops.length>=2) return toast('Tối đa 2 topping mỗi ly');
      if(inv(k)<1) return toast(`Hết ${nm(k)}, vào Kho nhập thêm`);
      K.tops.push(k);T.last=k;
    }
  } else {
    if(K[k]) return auto||toast(`Ly đã có ${nm(k)} rồi`);
    if(inv(k)<1) return toast(`Hết ${nm(k)}, vào Kho nhập thêm`);
    K[k]=1;
    w.style.setProperty('--sc',k=='tea'?'#b5652b':'#f3ead8');
    w.classList.remove('pour');void w.offsetWidth;w.classList.add('pour');
  }
  beep(k=='tea'?520:k=='milk'?620:760,.08);
  drawBar();drawOrd();
}
function rate(K,d,c){
  let s=5;const n=[];
  if(K.sug!=d.sugar){s--;n.push('sai độ ngọt')}
  if(K.ice!=d.ice){s--;n.push('sai lượng đá')}
  if(d.top&&!K.tops.includes(d.top)){s-=2;n.push('thiếu topping')}
  if(K.tops.some(t=>t!=d.top)){s--;n.push('thừa topping')}
  if(c.p/c.pm<.25){s--;n.push('chờ lâu')}
  if(c.k=='vip'&&n.length){s--;n.push('ông Đại khó tính')}
  return [cl(s,1,5),n];
}
function brew(){
  const c=C(T.sel),d=cur(c),K=T.K;
  if(T.st||!d) return;
  if(!K.tea||!K.milk) return toast('Ly cần có cả 🍃 trà và 🥛 sữa');
  const u=['tea','milk',...K.tops];
  for(const k of u) if(inv(k)<1) return toast(`Hết ${nm(k)}!`);
  u.forEach(use);
  [d.s,d.n]=rate(K,d,c);d.ip=1;T.for={c:c.id,d};
  T.st=1;T.tm=T.tmax=BR[S.up.br];
  $('#cupw').classList.add('shake');
  beep(330,.3);drawBar();drawOrd();
}
function pack(){
  if(T.st!=2) return;
  if(inv('cup')<1){toast('Hết 🥤 ly + nắp, vào Kho nhập thêm');return}
  use('cup');
  T.st=3;T.tm=T.tmax=0.8;
  $('#cupw').classList.add('pk');beep(440,.15);drawBar();drawOrd();
}
function nextCup(){
  const prev=T.for&&T.for.c;newCup();
  const c=cur(C(T.sel))?C(T.sel):cur(C(prev))?C(prev):T.cu.filter(x=>cur(x)).sort((a,b)=>a.p-b.p)[0];
  T.sel=c?c.id:0;
  drawTables();drawBar();drawOrd();autoFill();
}
function deliver(){
  const f=T.for,c=C(f.c);
  if(!c){toast('Khách đã đi mất, ly trà bị bỏ phí 😢');return nextCup()}
  T.st=4;
  const a=$('#cup').getBoundingClientRect(),b=$('#tb'+c.tb).getBoundingClientRect();
  const fl=document.createElement('div');
  fl.className='fly';fl.textContent='🧋';
  fl.style.left=a.left+a.width/2+'px';fl.style.top=a.top+'px';
  document.body.append(fl);fl.getBoundingClientRect();
  fl.style.left=b.left+b.width/2+'px';fl.style.top=b.top+b.height/2+'px';
  fl.style.fontSize='18px';
  setTimeout(()=>{
    fl.remove();
    if(c.gone){toast('Khách đã đi mất 😢');return nextCup()}
    const s=f.d.s;f.d.ip=0;f.d.done=1;
    S.ds.sold++;S.st.sold++;S.ds.rs+=s;S.ds.rc++;S.st.rs+=s;S.st.rc++;
    if(s==5) S.ds.five++;
    pop(c,'★'.repeat(s)+'☆'.repeat(5-s),s>=4?'g':'b');
    if(s<5&&f.d.n.length) toast(`${s}★: ${f.d.n.join(', ')}`);
    if(c.d.every(d=>d.done)) setTimeout(()=>pay(c),500);
    nextCup();
  },520);
}
function pay(c){
  const n=c.d.length,avg=c.d.reduce((a,d)=>a+d.s,0)/n,va=S.staff.vananh||0,e=EV();
  const base=c.d.reduce((a,d)=>a+25+(d.top?TOP[d.top].p:0),0)*SELL[S.ch];
  let amt=Math.round(base*(1+.05*va)*({vip:2,pair:1.15,take:1.3}[c.k]||1)*(.8+.04*avg)),tip=0,o='ok';
  let run=.04,sh=.07;
  if(c.k=='cheat'){run*=2.5;sh*=2}
  if(avg<=2){run*=1.5;sh*=1.5}
  run*=1-.1*va;sh*=1-.1*va;
  if(c.k=='vip') run=sh=0;
  const r=Math.random();
  if(r<run){o='ran';amt=0;S.ds.ran++}
  else if(r<run+sh){o='short';amt=Math.round(amt*R(.5,.8));S.ds.short++}
  else if(Math.random()<(avg>=5?.35:avg>=4?.15:.03)*(c.k=='tip'?2:1)*(e.tip||1)+.04*S.up.dc) tip=Math.round(amt*R(.15,.35));
  S.money+=amt+tip;S.ds.rev+=amt+tip;S.st.rev+=amt+tip;S.ds.tips+=tip;
  S.rep=cl(S.rep+(avg-3)*.4+(e.rv&&avg>=5?1:0),0,100);
  if(c.k=='vip') S.ds.vip++;
  pop(c,o=='ran'?'🏃 Trốn tiền!':o=='short'?`😶 Trả thiếu +${F(amt)}💰`:`+${F(amt)}💰${tip?' 💖+'+F(tip):''}`,o=='ok'?'g':'b');
  beep(o=='ok'?990:200,.2);
  gain(Math.round((8*n*(c.k=='vip'?2:1)+(avg>=5?4:0))*(1+.5*(S.ch-1))));
  leave(c,o=='ran'?'ran':'ok');save();
}
function skill(k){
  if(S.ph!='open') return toast('Chỉ dùng khi quán đang mở cửa');
  if(T.cd[k]>0) return toast(`Còn ${Math.ceil(T.cd[k])}s nữa mới dùng lại được`);
  const l=S.staff[k],s=STF.find(x=>x.k==k);
  if(k=='linh'){
    let n=0;for(let i=0;i<1+(l>>1);i++)n+=spawn();
    if(!n) return toast('Hết bàn trống rồi!');
    toast(`📣 Linh gọi được ${n} khách!`);
  }
  if(k=='hoan'){
    const cs=T.cu.filter(c=>!c.gone);
    if(!cs.length) return toast('Chưa có khách nào');
    cs.forEach(c=>{c.p=Math.min(c.pm,c.p+8+2*l);pop(c,`🍿 +${8+2*l}s`,'g')});
    toast('🍿 Hoàn mời cả quán ăn bim bim!');
  }
  T.cd[k]=s.cd;S.ds.skill++;beep(990,.2);
}

function gain(x){
  S.exp+=x;
  while(S.lv<MAXLV&&S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++;lvUp()}
}
function lvUp(){
  const m=(LORE[S.lv]?[`<div class="ev">${LORE[S.lv]}</div>`]:[]).concat(
    STF.filter(s=>s.lv==S.lv).map(s=>`${s.e} Có thể mời <b>${s.n}</b> vào làm (${s.r})`),
    Object.values(TOP).filter(o=>o.lv==S.lv&&o.u).map(o=>`${o.e} Có thể mở topping <b>${o.n}</b>`)
  );
  if(S.lv==2) m.push('👨‍👧 Sông & Biển và 🧑‍✈️ Ý bắt đầu ghé quán');
  if(S.lv==3) m.push('👴 Ông Đại (khách VIP) xuất hiện');
  beep(1200,.4);
  modal(`<h2>⭐ Lên Level ${S.lv}!</h2>${m.map(x=>`<div>${x}</div>`).join('')}<div class="mb"><button class="btn p" data-a="mx">Tuyệt! 💕</button></div>`);
}
function mkMis(){
  const t=Math.min(2,(S.lv-1)/8|0);
  return MS.filter(m=>(m[3]||1)<=S.lv).sort(()=>Math.random()-.5).slice(0,3)
    .map(m=>{
      const n=Math.round(m[2][t]*(m[0]=='rev'?SELL[S.ch]:1));
      return {k:m[0],n,t:m[1].replace('{n}',F(n)),r:Math.round((80+40*t)*SELL[S.ch]),x:30+15*t,c:0};
    });
}
function setupDay(){
  S.cw=S.wx;
  S.wc=Math.random()<.3?{t:R(50,180),to:WX[S.wx].fx?'cloud':['','rain','snow','drizzle'][S.ch]}:null;
  S.q=Array.from({length:1+(Math.random()<.5)},()=>{const s=R(25,190);return[s,s+R(20,40)]});
  S.ev=Math.random()<.3?1+(Math.random()*(EVS.length-1)|0):0;
  S.dm=mkMis();
}
function prepModal(){
  const w=WX[S.wx],e=EVS[S.ev];

  <div class="ev"><b>${w.e} ${w.n} · ${CITY[S.ch].n}</b>
  <div class="sm">${w.m<1?'Trời xấu, khách sẽ ít hơn.':w.ice==3?'Trời nóng, khách thích nhiều đá.':'Thời tiết dễ chịu.'}${wd()>=5?' Cuối tuần, quán sẽ đông!':''}</div></div>
  ${S.ev?`<div class="ev"><b>${e[0]}</b><div class="sm">${e[1]}</div></div>`:''}
  ${S.sp.length?`<div class="sm">🗑️ Hỏng qua đêm: ${S.sp.join(' · ')}</div>`:''}
  <div class="sm">Kho: ${stock().map(k=>OB(k).e+inv(k)).join(' · ')}</div>
  ${autoPack()?`<div class="sm">📦 Máy đóng gói tự động đang bật — pha xong sẽ tự gửi khách.</div>`:''}

function openDay(){

function report(){

    <span>Ly đã bán</span><b>${d.sold}</b>

function endDay(){

const nch=()=>S.ch==1&&S.lv>=10?2:S.ch==2&&S.lv>=20?3:S.ch;
const est=()=>Math.round(18*WDM[S.day%7]*WX[S.fc].m);
const sugQ=k=>{const e=est();return cl((ING[k]?e:Math.ceil(e*.85/S.tops.length)+2)-invT(k),0,room(k))};
function restockModal(){
  if(!S.fc){S.fc=P(CITY[nch()].wx);save()}
  const w=WX[S.fc],tw=S.day%7,tot=stock().reduce((a,k)=>a+sugQ(k)*uc(k),0);
  modal(`<h2>🌙 Nhập hàng cho ngày mai</h2>
  <div class="ev"><b>Dự báo: ${WD[tw]} · ${w.e} ${w.n}</b>
  <div class="sm">Dự kiến khoảng ${est()} ly${tw>=5?' · cuối tuần đông khách':''}${w.m<1?' · trời xấu, ít khách':''}</div></div>
  <div class="sm">Còn dùng được ngày mai: ${stock().map(k=>{
    const t=invT(k),x=inv(k)-t;

  </div>`);
}
function buySug(){
  const tot=stock().reduce((a,k)=>a+sugQ(k)*uc(k),0);
  if(S.money<tot) return toast(`Cần ${F(tot)}💰, hãy nhập lẻ trong 📦 Kho`);
  stock().forEach(k=>{const n=sugQ(k);if(n)add(k,n)});
  S.money-=tot;S.nc=(S.nc||0)+tot;beep(990);save();
  drawBar();mclose();restockModal();
}
function nextDay(){
  mclose();
  S.day++;S.t=0;S.ph='prep';S.ds=fresh();
  S.ds.cost=S.nc||0;S.nc=0;S.sp=[];
  for(const k in S.inv){
    let x=0;
    S.inv[k]=S.inv[k].filter(b=>b[1]>=S.day||(x+=b[0],0));
    if(x) S.sp.push(OB(k).e+x);
  }
  const nc=nch();
  S.wx=nc!=S.ch?P(CITY[nc].wx):S.fc||P(CITY[S.ch].wx);S.fc=null;
  if(nc!=S.ch){
    S.ch=nc;
    const k=nc==2?'kc':'km';
    S.tops.push(k);add(k,15);
    modal(CHI[nc]+`<div class="mb"><button class="btn p" data-a="mx">Lên đường! 🌸</button></div>`);
  }
  setupDay();save();drawAll();prepModal();
}

function buy(k,n){
  n=n=='max'?room(k):Math.min(+n,room(k));
  if(n<=0) return toast('Kho đã đầy loại này');
  const c=uc(k)*n;
  if(S.money<c) return toast(`Không đủ tiền (cần ${F(c)}💰)`);
  S.money-=c;add(k,n);
  S.ph=='restock'?S.nc=(S.nc||0)+c:S.ds.cost+=c;
  beep(990);save();reSheet();drawBar();
}
function hire(k){
  const s=STF.find(x=>x.k==k),l=S.staff[k]||0,c=l?150*l:s.c;
  if((!l&&S.lv<s.lv)||l>=5||(l&&!s.up)) return;
  if(S.money<c) return toast(`Cần ${F(c)}💰`);
  S.money-=c;S.staff[k]=l+1;
  beep(1200,.3);
  toast(l?`${s.e} ${s.n} lên Lv${l+1}!`:`${s.e} ${s.n} đã vào làm!`);
  save();drawStaff();reSheet();
}
function upgrade(k){
  const u=UPG.find(x=>x.k==k),l=S.up[k];
  if(l>=u.mx) return;
  const c=u.c(l);
  if(S.money<c) return toast(`Cần ${F(c)}💰`);
  S.money-=c;S.up[k]++;gain(15);
  beep(1200,.3);
  if(k=='pk') toast('📦 Máy đóng gói tự động đã lắp! Pha xong sẽ tự gửi khách.');
  else toast(`${u.e} ${u.n}: ${u.d(S.up[k])}`);
  save();drawTables();drawBar();reSheet();
}
function unlockTop(k){
  const o=TOP[k];
  if(S.tops.includes(k)||S.lv<o.lv||o.ch>S.ch) return;
  if(S.money<o.u) return toast(`Cần ${F(o.u)}💰`);
  S.money-=o.u;S.tops.push(k);add(k,10);
  beep(1200,.3);toast(`${o.e} Đã mở ${o.n} (tặng 10 phần)!`);
  save();drawBar();reSheet();
}
function claim(i){
  const m=S.dm[i];
  if(!m||m.c||S.ds[m.k]<m.n) return;
  m.c=1;S.money+=m.r;gain(m.x);
  beep(1200,.3);toast(`🎯 +${F(m.r)}💰 +${m.x} EXP`);
  save();reSheet();
}
const SH={

      :S.lv<s.lv?`<span class="sm mu">🔒 Lv${s.lv}</span>`:`<button class="b2 p" data-a="hire" data-k="${s.k}">Mời · ${s.c}💰</button>`;

    ${mx?'<span class="sm mu">✅ Đã có</span>':`<button class="b2 ${S.money>=c?'p':''}" data-a="up" data-k="${u.k}">${F(c)}💰</button>`}</div>`;
  }).join('')
  +'<h3>🧁 Mở khóa topping</h3>'+Object.keys(TOP).filter(k=>TOP[k].u).map(k=>{

    ${own?'<span class="sm mu">✅ Đã có</span>':ok?`<button class="b2 p" data-a="utop" data-k="${k}">${F(o.u)}💰</button>`:'<span class="sm mu">🔒</span>'}</div>`;
  }).join('')],
  quest:['🎯 Nhiệm vụ',()=>{
    const g=S.ch*10,q=CHQ[S.ch];
    return `<div class="ev"><b>📖 Chương ${S.ch} · ${q[0]}</b><div class="sm">${q[1]}</div>

      ${m.c?'✅':`<button class="b2 ${ok?'p':''}" data-a="claim" data-k="${i}" ${ok?'':'disabled'}>${ok?'Nhận':F(v)+'/'+F(m.n)}</button>`}</div>`;
    }).join('')
    +`<h3>📊 Tổng kết</h3><div class="sm">Đã bán ${F(S.st.sold)} ly · Doanh thu ${F(S.st.rev)}💰 · Đánh giá TB ${S.st.rc?(S.st.rs/S.st.rc).toFixed(2):'–'}★</div>
    <div class="bs" style="margin-top:8px">
      <button class="b2" data-a="snd">🔊 Âm thanh: ${S.snd?'Bật':'Tắt'}</button>

function openSheet(k){

  else{
    T.sheet=k;
    $('#sht').textContent=SH[k][0];
    $('#shb').innerHTML=SH[k][1]();
    $('#sheet').classList.remove('hide');

const reSheet=()=>T.sheet&&openSheet(T.sheet);

function act(a,k){
  switch(a){
    case 'sel':select(+k);break;
    case 'ing':case 'top':addIng(k);break;
    case 'lock':toast('Mở khóa topping trong ⬆️ Nâng cấp');break;
    case 'sug':case 'ice':
      if(T.st) return;
      T.K[a]=(T.K[a]+1)%(a=='sug'?5:4);
      beep(500,.05);drawBar();drawOrd();break;
    case 'reset':
      if(T.st) return toast('Đang pha, không làm lại được');
      newCup();drawBar();drawOrd();autoFill();break;
    case 'brew':brew();break;
    case 'pack':pack();break;
    case 'skill':skill(k);break;
    case 'sinfo':{const s=STF.find(x=>x.k==k);toast(`${s.e} ${s.n} (${s.r}): ${s.d(S.staff[k])}`)}break;
    case 'nav':if(T.modal&&k=='kho')mclose();openSheet(k);break;
    case 'buy':{const [i,n]=k.split(':');buy(i,n)}break;
    case 'up':upgrade(k);break;
    case 'hire':hire(k);break;
    case 'utop':unlockTop(k);break;
    case 'claim':claim(+k);break;
    case 'open':if(S.ph=='prep')openDay();break;
    case 'report':report();break;
    case 'rs':mclose();S.ph='restock';save();drawOrd();restockModal();break;
    case 'rsm':restockModal();break;
    case 'rsug':buySug();break;
    case 'next':if(S.ph=='restock'){openSheet('');nextDay()}break;
    case 'mx':mclose();break;
    case 'help':openSheet('');modal(HELP);break;
    case 'pause':T.pause^=1;$('#pause').textContent=T.pause?'▶':'⏸';break;
    case 'snd':S.snd^=1;save();reSheet();break;
    case 'wipe':if(confirm('Xóa toàn bộ tiến trình và chơi lại từ đầu?')){localStorage.removeItem(KEY);location.reload()}break;
  }
}
document.addEventListener('click',e=>{
  if(e.target.id=='sheet') return openSheet('');
  const el=e.target.closest('[data-a]');
  if(el) act(el.dataset.a,el.dataset.k);
});

function tick(dt){
  S.t+=dt;
  const cdKeys=Object.keys(T.cd);
  for(let i=0;i<cdKeys.length;i++){const k=cdKeys[i];T.cd[k]=Math.max(0,T.cd[k]-dt)}
  const w=S.wc;
  if(w&&!w.d&&S.t>=w.t){
    w.d=1;S.cw=w.to;
    const x=WX[S.cw];
    toast(x.fx?`${x.e} ${x.n}! Khách sẽ ít đi`:'⛅ Trời tạnh rồi, khách lại đông dần');
    drawTables();
  }
  if((T.sp-=dt)<=0){if(!quiet())spawn();nextSpawn()}
  for(let i=0,n=T.cu.length;i<n;i++){
    const c=T.cu[i];
    if(c.gone) continue;
    let allDone=true;
    for(let j=0;j<c.d.length;j++){if(!c.d[j].done&&!c.d[j].ip){allDone=false;break}}
    if(allDone) continue;
    c.p-=dt;
    if(c.p<=0) angry(c);
  }
  if(T.st==1&&(T.tm-=dt)<=0){
    T.st=2;$('#cupw').classList.remove('shake');beep(700,.15);drawBar();drawOrd();
    if(autoPack()) pack();
  }
  if(T.st==3&&(T.tm-=dt)<=0) deliver();
  if(S.t>=DAY) endDay();
}

const EL={};
const el=id=>EL[id]||(EL[id]=document.getElementById(id));
const setTxt=(id,v)=>{const e=el(id);if(e&&e.textContent!==v)e.textContent=v};
const setW=(id,v)=>{const e=el(id);const w=v+'%';if(e&&e.style.width!==w)e.style.width=w};

function refreshCdCache(){
  T.cdEls={};
  for(let i=0;i<T.cu.length;i++){const c=T.cu[i];const e=document.getElementById('cd'+c.id);if(e)T.cdEls[c.id]=e}
  T.skEls={};
  for(let i=0;i<STF.length;i++){const s=STF[i];if(s.sk){const e=document.getElementById('sk_'+s.k);if(e)T.skEls[s.k]=e}}
}
function ui(){
  const m=clk();
  setTxt('money',F(S.money));
  setTxt('rep',Math.round(S.rep));
  setTxt('lv',S.lv);
  setTxt('day',`${WDS[wd()]} · Ngày ${S.day}`);
  setTxt('xpt',`${S.exp}/${need(S.lv)}`);
  setTxt('wxi',WX[S.cw].e);
  setTxt('clock',String(m/60|0).padStart(2,'0')+':'+String(m%60|0).padStart(2,'0'));
  const deco=S.ph!='open'?CITY[S.ch].d
    :quiet()?'😴 Phố vắng khách... nghỉ tay chút nào 🌸'
    :rush()?'🔥 Giờ cao điểm!':CITY[S.ch].d;
  setTxt('deco',deco);
  const fx=WX[S.cw].fx||'';
  if(fx!=T.fx){T.fx=fx;$('#shop').className=fx}
  setW('xp',S.exp/need(S.lv)*100);
  setW('dp',S.t/DAY*100);
  if(!T.cdEls||T.cdEls._n!==T.cu.length){refreshCdCache();T.cdEls._n=T.cu.length}
  for(let i=0;i<T.cu.length;i++){
    const c=T.cu[i];
    const e=T.cdEls[c.id];
    if(!e||c.gone) continue;
    const f=cl(c.p/c.pm,0,1);
    let allDone=true;
    for(let j=0;j<c.d.length;j++){if(!c.d[j].done&&!c.d[j].ip){allDone=false;break}}
    const txt=allDone?'✓':Math.ceil(c.p);
    if(e.textContent!==txt) e.textContent=txt;
    e.style.setProperty('--p',f);
    e.style.setProperty('--cc',f>.5?'#8ed9c0':f>.25?'#ffd98a':'#ff6b9d');
    const hurry=f<.25&&!allDone;
    if(e.parentNode._hz!==hurry){e.parentNode._hz=hurry;e.parentNode.classList.toggle('hurry',hurry)}
  }
  if(!T.skEls) refreshCdCache();
  for(let i=0;i<STF.length;i++){
    const s=STF[i];
    const e=T.skEls[s.k];
    if(!e) continue;
    const cd=T.cd[s.k]||0;
    const txt=cd>0?Math.ceil(cd)+'s':'✨';
    if(e.textContent!==txt) e.textContent=txt;
    const rd=cd<=0&&S.ph=='open';
    if(e.parentNode._rd!==rd){e.parentNode._rd=rd;e.parentNode.classList.toggle('rd',rd)}
  }
  $('#shop').style.setProperty('--n',Math.max(0,Math.min(.28,(m/60-18)*.1)));
}

let last=performance.now(),acc=0,uiAcc=0,rafId=0;
const LOGIC_HZ=12,UI_HZ=3;
const LOGIC_STEP=1/LOGIC_HZ,UI_STEP=1/UI_HZ;

function loop(now){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(S.ph=='open'&&!T.pause&&!T.modal){
    acc+=dt;let steps=0;
    while(acc>=LOGIC_STEP&&steps++<4){tick(LOGIC_STEP);acc-=LOGIC_STEP}
    if(steps>=4) acc=0;
  } else acc=0;
  uiAcc+=dt;
  if(uiAcc>=UI_STEP){uiAcc=0;ui()}
  if((T.sv+=dt)>3){T.sv=0;save();drawNav()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    if(AC) AC.suspend();
  } else if(!rafId){
    last=performance.now();acc=0;
    if(AC) AC.resume();
    rafId=requestAnimationFrame(loop);
  }
});

newCup();
if(!S.dm.length){S.wx=P(['sun','cloud']);setupDay()}
drawAll();
if(!S.seen){S.seen=1;save();modal(INTRO);modal(HELP)}
if(S.ph=='prep') prepModal();
else if(S.ph=='end') report();
else if(S.ph=='restock') restockModal();
requestAnimationFrame(loop);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
